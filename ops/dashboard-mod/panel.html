<title>Living Lyrics Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: a status sheet, read in ten seconds. Rows on hairline rules, no cards; numbers in tabular
   figures, right-aligned; one accent for progress, semantic colour only in 6px dots and deltas.
   Order: what waits on the owner, plan limits, work in progress, chats, word sync. */
:root {
  --bg: #ffffff; --ink: #16181d; --ink-2: #4b5260; --ink-3: #6b7280; --rule: #e4e6eb; --track: #e1e4ea;
  --accent: #3b5bdb; --ok: #1a8a4a; --warn: #9a5b00; --bad: #d03b3b; --you: rgba(214, 140, 10, 0.07); --you-rule: rgba(214, 140, 10, 0.28);
  --sans: Inter, -apple-system, 'Segoe UI', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1013; --ink: #e9ebef; --ink-2: #a1a7b3; --ink-3: #6b717d; --rule: #22252b; --track: #23262d;
    --accent: #7b93f2; --ok: #3fbf79; --warn: #e3a53a; --bad: #ef6b6b; --you: rgba(227, 165, 58, 0.08); --you-rule: rgba(227, 165, 58, 0.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1013; --ink: #e9ebef; --ink-2: #a1a7b3; --ink-3: #6b717d; --rule: #22252b; --track: #23262d;
  --accent: #7b93f2; --ok: #3fbf79; --warn: #e3a53a; --bad: #ef6b6b; --you: rgba(227, 165, 58, 0.08); --you-rule: rgba(227, 165, 58, 0.3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 12.5px; line-height: 1.4; -webkit-font-smoothing: antialiased; font-feature-settings: 'tnum', 'cv11'; }
main { max-width: 560px; margin: 0 auto; padding-block: 12px 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
section { padding-block: 10px; border-top: 1px solid var(--rule); display: grid; gap: 6px; min-width: 0; }
h2 { margin: 0 0 2px; font-size: 11.5px; font-weight: 600; color: var(--ink-2); display: flex; justify-content: space-between; gap: 8px; }
h2 span { font-weight: 400; color: var(--ink-3); }
.mute { color: var(--ink-3); }
.sub { color: var(--ink-2); }
.r { text-align: right; white-space: nowrap; }
.clip { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.ic { width: 12px; height: 12px; display: inline-block; vertical-align: -1px; color: var(--ink); }
.ic svg { width: 100%; height: 100%; display: block; }
.dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; background: var(--ink-3); flex: none; }
.dot.working { background: var(--ok); } .dot.waiting, .dot.stalled { background: var(--warn); } .dot.bad { background: var(--bad); }
.dot.finished { background: color-mix(in srgb, var(--accent) 35%, transparent); box-shadow: inset 0 0 0 1.5px var(--accent); }
.dot.idle, .dot.retired, .dot.none { background: transparent; box-shadow: inset 0 0 0 1.5px var(--ink-3); }
.dot { align-self: center; }
.bar { position: relative; height: 3px; background: var(--track); }
.bar i { position: absolute; inset: 0 auto 0 0; background: var(--accent); }
.bar i.warn { background: var(--warn); } .bar i.bad { background: var(--bad); }
.bar i.soft { background: var(--accent); opacity: 0.28; }
.bar .goal { position: absolute; top: -3px; bottom: -3px; width: 1.5px; background: var(--ink-2); }

/* Header */
.head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding-bottom: 8px; }
.head b { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
.live { font-size: 11.5px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }
.road { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; padding-bottom: 10px; }
.road .bar { grid-column: 1 / 3; }
.road .steps { grid-column: 1 / 3; color: var(--ink-3); font-size: 11.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* Owner */
.you { border-top-color: transparent; border-left: 2px solid var(--warn); padding-left: 12px; margin-block: 2px 8px; }
.you + section { border-top-color: transparent; }
.you h2 { color: var(--warn); }
.you ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.you li { display: grid; gap: 2px; }
.you li .sub { font-size: 11.5px; }
.you li b { font-weight: 600; }

/* Limits: one grid, a row per window */
.lim { display: grid; grid-template-columns: minmax(84px, 1fr) 44px minmax(36px, 120px) 36px 72px 52px; gap: 5px 8px; align-items: center; }
.lim .svc { font-weight: 600; display: flex; gap: 5px; align-items: center; white-space: nowrap; }
.lim .plan { color: var(--ink-3); font-size: 11px; }
.lim .w { color: var(--ink-2); }
.lim .p { text-align: right; font-weight: 500; }
.lim .rs { color: var(--ink-3); font-size: 11px; white-space: nowrap; text-align: right; }
.lim svg.sp { width: 52px; height: 14px; display: block; overflow: visible; justify-self: end; }
.lim .rule { grid-column: 1 / -1; border-top: 1px solid var(--rule); height: 0; }
.lim .note { grid-column: 3 / -1; color: var(--ink-3); font-size: 11px; }
.lim .hd { color: var(--ink-3); font-size: 10.5px; }
.lim .hd.r { text-align: right; }
.lim .plan.wide { grid-column: 1 / 3; }

/* Work and chats: two lines per row */
.rows { display: grid; }
.row { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 2px 0; padding-block: 8px; }
.row > .dot { margin-top: 5px; align-self: start; }
.row + .row { border-top: 1px solid var(--rule); }
.row .t { display: flex; align-items: center; gap: 6px; min-width: 0; }
.row .t b { font-weight: 600; white-space: nowrap; }
.row .t.wt { grid-column: 2 / 4; align-items: baseline; }
.row .t.wt b { white-space: normal; font-weight: 500; }
.row .t.wt .dot { align-self: center; }
.row .t .id { color: var(--ink-3); font-size: 11px; display: inline-block; min-width: 3.2ch; }
.row .s { grid-column: 2 / 4; color: var(--ink-2); font-size: 12px; }
.row .s.mute { color: var(--ink-3); font-size: 11px; }
.row .m { color: var(--ink-3); font-size: 11px; white-space: nowrap; text-align: right; }

/* Word sync */
.sync { display: grid; grid-template-columns: minmax(0, max-content) minmax(56px, 1fr) 50px 32px 44px; gap: 6px 12px; align-items: center; }
.sync .p { text-align: right; font-weight: 500; }
.sync .d { text-align: right; font-size: 11px; }
.sync .srule { grid-column: 1 / -1; border-top: 1px solid var(--rule); margin-top: -2px; }
.sync .hd { color: var(--ink-3); font-size: 10.5px; text-align: right; }
.sync .d.up { color: var(--ok); }
.sync .n { text-align: right; color: var(--ink-3); font-size: 11px; }
.sync .met { color: var(--ok); }

footer { border-top: 1px solid var(--rule); padding-top: 10px; margin-top: 4px; display: flex; justify-content: space-between; gap: 10px; color: var(--ink-3); font-size: 11px; }
.empty { color: var(--ink-3); padding-block: 12px; border-top: 1px solid var(--rule); }
@media (max-width: 370px) { .lim { grid-template-columns: 66px 42px minmax(30px, 1fr) 32px 62px; } .lim svg.sp, .lim .spc { display: none; } }
</style>

<main>
  <div class="head"><b>Living Lyrics</b><span class="live"><span class="dot none" id="dot"></span><span id="live">ждём Станцию</span></span></div>
  <div id="root"><div class="empty">Состояние придёт со Станции в течение двух минут.</div></div>
</main>

<template id="icons">
  <span data-k="claude"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M4.709 15.955l4.72-2.647.08-.23-.08-.128H9.2l-.79-.048-2.698-.073-2.339-.097-2.266-.122-.571-.121L0 11.784l.055-.352.48-.321.686.06 1.52.103 2.278.158 1.652.097 2.449.255h.389l.055-.157-.134-.098-.103-.097-2.358-1.596-2.552-1.688-1.336-.972-.724-.491-.364-.462-.158-1.008.656-.722.881.06.225.061.893.686 1.908 1.476 2.491 1.833.365.304.145-.103.019-.073-.164-.274-1.355-2.446-1.446-2.49-.644-1.032-.17-.619a2.970 2.970 0 01-.104-.729L6.283.134 6.696 0l.996.134.42.364.62 1.414 1.002 2.229 1.555 3.03.456.898.243.832.091.255h.158V9.01l.128-1.706.237-2.095.23-2.695.08-.76.376-.91.747-.492.584.28.48.685-.067.444-.286 1.851-.559 2.903-.364 1.942h.212l.243-.242.985-1.306 1.652-2.064.73-.82.85-.904.547-.431h1.033l.76 1.129-.34 1.166-1.064 1.347-.881 1.142-1.264 1.7-.79 1.36.073.11.188-.02 2.856-.606 1.543-.28 1.841-.315.833.388.091.395-.328.807-1.969.486-2.309.462-3.439.813-.042.03.049.061 1.549.146.662.036h1.622l3.02.225.79.522.474.638-.079.485-1.215.62-1.64-.389-3.829-.91-1.312-.329h-.182v.11l1.093 1.068 2.006 1.81 2.509 2.33.127.578-.322.455-.34-.049-2.205-1.657-.851-.747-1.926-1.62h-.128v.17l.444.649 2.345 3.521.122 1.08-.17.353-.608.213-.668-.122-1.374-1.925-1.415-2.167-1.143-1.943-.14.08-.674 7.254-.316.37-.729.28-.607-.461-.322-.747.322-1.476.389-1.924.315-1.53.286-1.9.17-.632-.012-.042-.14.018-1.434 1.967-2.18 2.945-1.726 1.845-.414.164-.717-.37.067-.662.401-.589 2.388-3.036 1.44-1.882.93-1.086-.006-.158h-.055L4.132 18.56l-1.13.146-.487-.456.061-.746.231-.243 1.908-1.312-.006.006z" fill="#D97757" fill-rule="nonzero"></path></svg></span>
  <span data-k="grok"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="currentColor" d="M9.27 15.29l7.978-5.897c.391-.29.95-.177 1.137.272.98 2.369.542 5.215-1.41 7.169-1.951 1.954-4.667 2.382-7.149 1.406l-2.711 1.257c3.889 2.661 8.611 2.003 11.562-.953 2.341-2.344 3.066-5.539 2.388-8.42l.006.007c-.983-4.232.242-5.924 2.75-9.383.06-.082.12-.164.179-.248l-3.301 3.305v-.01L9.267 15.292M7.623 16.723c-2.792-2.67-2.31-6.801.071-9.184 1.761-1.763 4.647-2.483 7.166-1.425l2.705-1.25a7.808 7.808 0 00-1.829-1A8.975 8.975 0 005.984 5.830c-2.533 2.536-3.33 6.436-1.962 9.764 1.022 2.487-.653 4.246-2.34 6.022-.599.63-1.199 1.259-1.682 1.925l7.62-6.815"></path></svg></span>
  <span data-k="gemini"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M20.616 10.835a14.147 14.147 0 01-4.45-3.001 14.111 14.111 0 01-3.678-6.452.503.503 0 00-.975 0 14.134 14.134 0 01-3.679 6.452 14.155 14.155 0 01-4.45 3.001c-.65.28-1.318.505-2.002.678a.502.502 0 000 .975c.684.172 1.35.397 2.002.677a14.147 14.147 0 014.45 3.001 14.112 14.112 0 013.679 6.453.502.502 0 00.975 0c.172-.685.397-1.351.677-2.003a14.145 14.145 0 013.001-4.45 14.113 14.113 0 016.453-3.678.503.503 0 000-.975 13.245 13.245 0 01-2.003-.678z" fill="#3186FF"></path></svg></span>
</template>

<script>
const ICON = {};
document.getElementById('icons').content.querySelectorAll('span').forEach(s => { ICON[s.dataset.k] = s.innerHTML; });
const CHAT = { working: 'работает', waiting: 'ждёт вас', idle: 'свободен', retired: 'спит', none: 'не запущен' };
const WORK = { working: 'работает', stalled: 'остановился', finished: 'сдал, на проверке', none: 'не начат' };
const STALE_MIN = 45;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const level = u => (u >= 90 ? 'bad' : u >= 75 ? 'warn' : '');
/** '1347 М' → '1 347 М' (thin no-break space between thousands). */
const group = t => String(t ?? '').replace(/\d{4,}/g, n => Number(n).toLocaleString('ru-RU'));
let last = null;

function dur(m) {
  if (m === null || m === undefined) return '';
  if (m < 1) return 'сейчас';
  if (m < 60) return `${m} мин`;
  if (m < 1440) return `${Math.floor(m / 60)} ч${m % 60 ? ` ${m % 60} мин` : ''}`;
  return `${Math.floor(m / 1440)} дн ${Math.floor((m % 1440) / 60)} ч`;
}
const minutesSince = iso => { const t = Date.parse(iso || ''); return Number.isNaN(t) ? null : Math.max(0, Math.round((Date.now() - t) / 60000)); };
const hhmm = iso => { const t = new Date(iso || ''); return Number.isNaN(t.getTime()) ? '' : t.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }); };

/** Time to a reset: from the exact moment when the Station sent it, else from its countdown text. */
function resetIn(w, at) {
  if (w.resetAt) { const t = Date.parse(w.resetAt); if (!Number.isNaN(t)) return short(Math.max(0, Math.round((t - Date.now()) / 60000))); }
  const m = (w.reset || '').match(/через\s+(?:(\d+)d\s*)?(?:(\d+)h)?\s*(?:(\d+)m)?/);
  if (m) return short(Math.max(0, (Number(m[1] || 0) * 24 + Number(m[2] || 0)) * 60 + Number(m[3] || 0) - (minutesSince(at) || 0)));
  return w.reset ? w.reset.replace(/^сброс\s+/, 'в ') : '—';
}

/** Compact countdown: '3 ч 35 м', '3 д 2 ч'. */
function short(m) { return m >= 1440 ? `${Math.floor(m / 1440)} д ${Math.floor((m % 1440) / 60)} ч` : m >= 60 ? `${Math.floor(m / 60)} ч ${m % 60} м` : `${m} м`; }

/** 'сброс 07:10' → 'в 07:10'; 'сброс через 4h 47m' → '4 ч 47 м'. */
function reset(text) {
  if (!text) return '';
  const m = text.match(/через\s+(?:(\d+)d\s*)?(?:(\d+)h)?\s*(?:(\d+)m)?/);
  if (!m) return text.replace(/^сброс\s+/, 'в ');
  return short((Number(m[1] || 0) * 24 + Number(m[2] || 0)) * 60 + Number(m[3] || 0));
}

/** The window's last seven days as a line: one scale (0–100 %), the latest point marked. */
function spark(trend, key) {
  const bins = new Map();
  for (const p of trend || []) {
    if (typeof p[key] !== 'number') continue;
    const k = Math.floor(p.t / 21600000), b = bins.get(k);
    if (!b || p[key] >= b[key]) bins.set(k, { t: k * 21600000, [key]: p[key] });
  }
  const pts = [...bins.values()];
  if (pts.length < 2) return '<span class="spc"></span>';
  const t0 = pts[0].t, span = Math.max(1, pts[pts.length - 1].t - t0), W = 52, H = 14;
  const xy = pts.map(p => [((p.t - t0) / span) * W, H - (Math.min(100, p[key]) / 100) * H]);
  const d = xy.map(([x, y], i) => `${i ? 'L' : 'M'}${x.toFixed(1)},${y.toFixed(1)}`).join('');
  const [ex, ey] = xy[xy.length - 1];
  return `<svg class="sp" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><title>за ${span >= 86400000 ? `${Math.round(span / 86400000)} дн` : `${Math.max(1, Math.round(span / 3600000))} ч`}</title><line x1="0" x2="${W}" y1="${H}" y2="${H}" stroke="var(--rule)" vector-effect="non-scaling-stroke"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" opacity="0.8" vector-effect="non-scaling-stroke"/><circle cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" r="1.6" fill="var(--accent)"/></svg>`;
}

function limitRows(icon, name, plan, wins, trend, keys, at) {
  const head = `<span class="svc"><i class="ic">${ICON[icon]}</i>${name}</span>`;
  if (!wins || !wins.length) return `${head}<span class="note">${plan ? `${esc(plan)} · ` : ''}нет данных</span>`;
  return wins.map((w, i) => `${i ? `<span class="plan clip">${i === 1 ? esc(plan) : ''}</span>` : head}<span class="w">${esc(w.label)}</span><span class="bar"><i class="${level(w.used)}" style="width:${Math.min(100, Math.max(0, w.used))}%"></i></span><span class="p">${Math.round(w.used)} %</span><span class="rs">${esc(resetIn(w, at))}</span>${spark(trend, keys[i])}`).join('')
    + (wins.length === 1 && plan ? `<span class="plan clip">${esc(plan)}</span><span class="note" style="grid-column:2/-1"></span>` : '');
}

function render(d) {
  last = d;
  if (!d) return;
  const m = minutesSince(d.at), stale = m === null || m > STALE_MIN;
  document.getElementById('dot').className = `dot ${stale ? 'waiting' : 'working'}`;
  document.getElementById('live').textContent = stale ? (m === null ? 'нет данных' : `Станция молчит ${dur(m)}`) : `обновлено ${m < 1 ? 'только что' : `${dur(m)} назад`} · ${hhmm(d.at)}`;
  const out = [];
  const L = d.limits || {}, P = L.plans || {}, trend = d.trend || [];

  if (d.roadmap) {
    const steps = d.steps || [], open = steps.filter(s => s.done < 1);
    out.push(`<div class="road"><span><b>${esc(d.roadmap.title)}</b></span><span class="r"><b>${d.roadmap.percent} %</b></span><span class="bar"><i style="width:${d.roadmap.percent}%"></i></span>${open.length ? `<span class="steps">осталось — ${open.map(s => `${esc(s.name.toLowerCase())}${s.done > 0 ? ` (${Math.round(s.done * 100)} %)` : ''}`).join('; ')}</span>` : ''}</div>`);
  }

  const you = d.you || [];
  if (you.length) out.push(`<section class="you"><h2>Нужно от вас · ${you.length}</h2><ul>${you.map(t => `<li><b>${esc(t.title)}</b>${t.how ? `<span class="sub">${esc(t.how)}</span>` : ''}</li>`).join('')}</ul></section>`);

  const g = L.grok;
  const gw = g && g.weekly;
  const months = { January: '01', February: '02', March: '03', April: '04', May: '05', June: '06', July: '07', August: '08', September: '09', October: '10', November: '11', December: '12' };
  const grokReset = r => (r || '').replace(/^(\w+) (\d+), (\d+:\d+)$/, (_, mo, d, hm) => `${d.padStart(2, '0')}.${months[mo] || mo} ${hm}`);
  const grokHead = `<span class="svc"><i class="ic">${ICON.grok}</i>Grok</span>`;
  const grokWin = gw ? `${grokHead}<span class="w">неделя</span><span class="bar"><i class="${level(gw.used)}" style="width:${Math.min(100, Math.max(0, gw.used))}%"></i></span><span class="p">${gw.used} %</span><span class="rs" title="${gw.tz ? '' : 'время с экрана Grok, пояс не подписан'}">${esc(grokReset(gw.reset))}</span>${spark(trend, 'kw')}` : '';
  const grokTokens = g ? `${gw ? `<span class="plan clip">${esc(g.plan)}</span>` : grokHead}<span class="w">сутки</span><span class="p" style="grid-column:3/5">${esc(group(g.today))} ток.</span><span class="r mute" style="font-size:11px;grid-column:5/7">${g.week ? `${esc(group(g.week))} за 7 д` : ''}</span>` : '';
  const grok = g ? grokWin + grokTokens + (gw ? '' : `<span class="plan clip">${esc(g.plan)}</span><span class="note" style="grid-column:2/-1">окно лимита: нет данных</span>`) : `${grokHead}<span class="note">нет данных</span>`;
  out.push(`<section><h2>Лимиты</h2><div class="lim"><span></span><span class="hd">окно</span><span class="hd r" style="grid-column:3/5">использовано</span><span class="hd r">сброс</span><span class="hd r">7 дней</span><span class="rule"></span>
    ${limitRows('claude', 'Claude', P.claude, L.claude, trend, ['c5', 'cw'], d.at)}<span class="rule"></span>
    ${limitRows('gemini', 'Gemini', P.gemini, L.gemini, trend, ['g5', 'gw'], d.at)}<span class="rule"></span>
    ${grok}</div></section>`);

  const work = d.work || [];
  out.push(`<section><h2>В работе <span><span class="dot working"></span> идёт · <span class="dot finished"></span> на проверке</span></h2>${work.length ? `<div class="rows">${work.map(w => `<div class="row">
      <span class="dot ${esc(w.state)}"></span><span class="t wt"><span class="id">${esc(w.id.toUpperCase())}</span><b>${esc(w.title)}</b></span>
      <span class="s mute">${[esc(w.who), w.state === 'working' ? '' : esc(WORK[w.state] || w.state), w.session !== null && w.session !== undefined ? `сессия ${dur(w.session)}` : '', w.state === 'working' && w.idle !== null && w.idle !== undefined ? `шаг ${w.idle < 1 ? 'только что' : `${dur(w.idle)} назад`}` : '', w.open !== null && w.open !== undefined ? `в работе ${dur(w.open)}` : ''].filter(Boolean).join(' · ')}</span>
      ${w.step ? `<span class="s clip" title="${esc(w.step)}">${esc(w.step)}</span>` : ''}
    </div>`).join('')}</div>` : '<span class="mute">Сейчас задач нет.</span>'}</section>`);

  const rank = c => (c.state === 'waiting' ? 0 : c.state === 'working' ? 1 : 2);
  const chats = [...(d.chats || [])].sort((a, b) => rank(a) - rank(b) || (a.lastMin ?? 1e9) - (b.lastMin ?? 1e9));
  if (chats.length) out.push(`<section><h2>Чаты <span><span class="dot working"></span> работает · <span class="dot idle"></span> свободен</span></h2><div class="rows">${chats.map(c => `<div class="row">
      <span class="dot ${esc(c.state)}"></span><span class="t"><b>${esc(c.name.replace(/^LL · /, ''))}</b>${c.state === 'waiting' ? `<span style="color:var(--warn)">ждёт вас${c.minutes !== null && c.minutes !== undefined ? ` ${esc(dur(c.minutes))}` : ''}</span>` : c.state === 'none' || c.state === 'retired' ? `<span class="mute">${esc(CHAT[c.state])}</span>` : ''}</span>
      <span class="m">${c.lastMin === null || c.lastMin === undefined ? '' : c.lastMin < 1 ? 'только что' : `${esc(dur(c.lastMin))} назад`}</span>
      ${c.state === 'waiting' && c.waiting ? `<span class="s" style="color:var(--warn)">ждёт: ${esc(c.waiting)}</span>` : c.last ? `<span class="s clip" title="${esc(c.last)}">${esc(c.last)}</span>` : ''}
    </div>`).join('')}</div></section>`);

  const songs = d.songs || [];
  if (songs.length) out.push(`<section><h2><span style="color:var(--ink-2);font-weight:600">Подсветка по словам · цель ${d.goal ?? '—'} %</span></h2><div class="sync"><span></span><span></span><span class="hd">доказано</span><span class="hd">сутки</span><span class="hd">строк</span><span class="srule"></span>${songs.map(s => {
    const p = s.total ? s.proven / s.total : 0, pl = s.total ? Math.max(p, (s.placed ?? s.proven) / s.total) : 0, pct = Math.round(p * 100), met = d.goal && pct >= d.goal;
    const dl = s.delta === null || s.delta === undefined ? '—' : s.delta > 0 ? `+${s.delta}` : s.delta < 0 ? `−${-s.delta}` : '0';
    return `<span class="clip">${esc(s.label)}</span><span class="bar"><i class="soft" style="width:${(pl * 100).toFixed(1)}%"></i><i style="width:${(p * 100).toFixed(1)}%"></i>${d.goal ? `<span class="goal" style="left:${d.goal}%"></span>` : ''}</span><span class="p ${met ? 'met' : ''}">${pct} %</span><span class="d ${s.delta > 0 ? 'up' : 'mute'}">${dl}</span><span class="n">${s.proven}/${s.total}</span>`;
  }).join('')}</div></section>`);

  const h = d.hygiene;
  out.push(`<footer><span>${h ? (h.issues && h.issues.length ? `<span title="${esc(h.issues.join('\n'))}">порядок: ${h.issues.length + (h.more || 0)} на заметку</span>` : 'порядок: чисто') : ''}</span><span>данные Станции</span></footer>`);
  document.getElementById('root').innerHTML = out.join('');
}

setInterval(() => render(last), 30000);

(async () => {
  const db = window.claude && await claude.use('db');
  if (!db) { document.getElementById('live').textContent = 'войдите в claude.ai'; return; }
  db.doc('dashboard/now').onSnapshot(snap => render(snap && snap.exists ? snap.data() : null), () => { document.getElementById('live').textContent = 'нет связи'; });
})();
</script>
