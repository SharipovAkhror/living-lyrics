<title>Living Lyrics Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: a control-room column beside the chat, in the /dashboard card's language. Summary first
   (the owner, limits with their week), then who works and for how long, then progress. One dark
   look by design: brand colour per service, semantic green/amber/red for state. */
:root {
  --bg: #0b0c10; --card: #12141a; --raise: #181b23; --line: rgba(255, 255, 255, 0.07); --line-2: rgba(255, 255, 255, 0.12);
  --ink: #eef0f5; --ink-2: #a3a9b6; --ink-3: #697080;
  --accent: #7c6cff; --accent-2: #b46cff; --ok: #34d399; --warn: #fbbf24; --bad: #f87171;
  --claude: #e58a68; --gemini: #4d94ff; --grok: #eef0f5; --you: #fbbf24;
  --sans: Inter, 'Segoe UI', -apple-system, system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--ink); font-family: var(--sans); font-size: 13px; line-height: 1.38; -webkit-font-smoothing: antialiased; font-feature-settings: 'cv11', 'ss01'; }
main { max-width: 560px; margin: 0 auto; padding-block: 14px 28px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 10px;
  background-image: radial-gradient(480px 240px at 0% 0%, rgba(124, 108, 255, 0.16), transparent 70%); }
.n { font-variant-numeric: tabular-nums; font-feature-settings: 'tnum', 'cv11'; }
.ic { width: 16px; height: 16px; display: inline-flex; flex: none; color: var(--grok); }
.ic svg { width: 100%; height: 100%; display: block; }
.none { color: var(--ink-3); font-size: 12px; }
.dim { color: var(--ink-3); }

/* Header */
header { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.mark { width: 32px; height: 32px; border-radius: 10px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); display: grid; place-items: center; box-shadow: 0 4px 16px rgba(124, 108, 255, 0.35), inset 0 0 0 1px rgba(255, 255, 255, 0.18); }
.mark svg { width: 17px; height: 17px; }
h1 { font-size: 15px; font-weight: 650; letter-spacing: -0.01em; margin: 0; }
.sub { color: var(--ink-3); font-size: 11.5px; }
.live { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--ok); padding: 3px 10px; border-radius: 99px; background: rgba(52, 211, 153, 0.1); box-shadow: inset 0 0 0 1px rgba(52, 211, 153, 0.22); white-space: nowrap; }
.live i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.18); }
.live.stale { color: var(--warn); background: rgba(251, 191, 36, 0.1); box-shadow: inset 0 0 0 1px rgba(251, 191, 36, 0.22); }
@media (prefers-reduced-motion: no-preference) { .live:not(.stale) i { animation: pulse 2.4s ease-in-out infinite; } }
@keyframes pulse { 50% { box-shadow: 0 0 0 5px rgba(52, 211, 153, 0.05); } }

/* Blocks */
section { background: var(--card); border-radius: 14px; box-shadow: inset 0 0 0 1px var(--line); padding: 10px 12px; display: grid; gap: 9px; min-width: 0; }
h2 { font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin: 0; }
h2 span { letter-spacing: 0; text-transform: none; font-weight: 500; }

/* Roadmap: one segment per step, width by weight */
.road-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.road-top b { font-weight: 600; }
.road-top .n { font-size: 15px; font-weight: 650; }
.segs { display: flex; gap: 3px; height: 8px; }
.seg { position: relative; border-radius: 3px; background: rgba(255, 255, 255, 0.07); overflow: hidden; }
.seg i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
.seg.done i { background: linear-gradient(90deg, #10b981, var(--ok)); }
.steps { display: grid; gap: 3px; font-size: 12px; }
.step { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 7px; align-items: center; color: var(--ink-2); }
.step .tick { width: 14px; height: 14px; border-radius: 50%; display: grid; place-items: center; font-size: 9px; box-shadow: inset 0 0 0 1.5px var(--ink-3); }
.step.done { color: var(--ink-3); }
.step.done .tick { background: rgba(52, 211, 153, 0.15); box-shadow: inset 0 0 0 1.5px var(--ok); color: var(--ok); }
.step.part .tick { box-shadow: inset 0 0 0 1.5px var(--accent); }
.step span:nth-child(2) { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.step .n { font-size: 11px; color: var(--ink-3); }

/* Owner */
.you { background: rgba(251, 191, 36, 0.07); box-shadow: inset 0 0 0 1px rgba(251, 191, 36, 0.28); }
.you h2 { color: var(--you); justify-content: flex-start; }
.badge { min-width: 17px; height: 17px; padding: 0 5px; border-radius: 99px; background: var(--you); color: #1a1302; font-size: 10.5px; display: grid; place-items: center; letter-spacing: 0; font-weight: 700; }
.you ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
.you li { display: grid; gap: 2px; }
.you li b { font-weight: 600; }
.you li span { color: var(--ink-2); font-size: 12px; }

/* Limits: a row per service, a bar per window, the week as a sparkline */
.svc { display: grid; gap: 7px; padding: 9px 10px; border-radius: 11px; background: var(--raise); box-shadow: inset 0 0 0 1px var(--line); }
.svc-h { display: flex; align-items: center; gap: 7px; }
.svc-h b { font-weight: 600; }
.svc-h small { margin-left: auto; color: var(--ink-3); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.win { display: grid; grid-template-columns: 52px minmax(0, 1fr) 40px; gap: 8px; align-items: center; font-size: 12px; color: var(--ink-2); }
.win .n { text-align: right; color: var(--ink); font-weight: 600; }
.win .reset { grid-column: 2 / 4; margin-top: -5px; font-size: 10.5px; color: var(--ink-3); }
.bar { position: relative; height: 6px; border-radius: 99px; background: rgba(255, 255, 255, 0.07); }
.bar i { position: absolute; inset: 0 auto 0 0; border-radius: 99px; background: var(--c, var(--accent)); }
.bar i.warn { background: var(--warn); }
.bar i.bad { background: var(--bad); }
.spark { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 8px; align-items: end; font-size: 10.5px; color: var(--ink-3); }
.spark svg { width: 100%; height: 34px; display: block; overflow: visible; }
.big { font-size: 22px; font-weight: 650; letter-spacing: -0.02em; line-height: 1.05; }
.kv { display: flex; align-items: baseline; gap: 8px; color: var(--ink-2); font-size: 12px; }
.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; align-items: end; height: 34px; }
.days i { display: block; border-radius: 3px 3px 1px 1px; background: rgba(238, 240, 245, 0.18); min-height: 2px; }
.days i.zero { background: rgba(238, 240, 245, 0.08); }
.days i.today { background: var(--grok); }
.days-l { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; font-size: 9.5px; color: var(--ink-3); text-align: center; }

/* Chats and executors */
.chats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 6px; }
.chat { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 1px 7px; align-items: center; padding: 6px 9px; border-radius: 10px; background: var(--raise); box-shadow: inset 0 0 0 1px var(--line); }
.chat b { font-weight: 600; font-size: 12.5px; }
.chat .st { grid-column: 2; font-size: 11px; color: var(--ink-3); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); }
.dot.working { background: var(--ok); box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.18); }
.dot.waiting, .dot.stalled { background: var(--warn); }
.dot.retired, .dot.none { background: transparent; box-shadow: inset 0 0 0 1.5px var(--ink-3); }
.ags { display: grid; }
.ag { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 2px 9px; align-items: center; padding: 8px 0; }
.ag + .ag { border-top: 1px solid var(--line); }
.ag .who { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ag .who b { font-weight: 600; margin-right: 6px; }
.ag .who span { color: var(--ink-2); }
.ag .meta { grid-column: 2 / 4; font-size: 11px; color: var(--ink-3); }
.ag .det { grid-column: 2 / 4; font-size: 11.5px; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.chip { font-style: normal; font-size: 10.5px; font-weight: 500; padding: 2px 8px; border-radius: 99px; white-space: nowrap; color: var(--ink-2); background: rgba(255, 255, 255, 0.06); }
.chip.working { color: var(--ok); background: rgba(52, 211, 153, 0.12); }
.chip.stalled { color: var(--warn); background: rgba(251, 191, 36, 0.12); }
.chip.review { color: #a99dff; background: rgba(124, 108, 255, 0.16); }
.ic.gh { color: var(--ink-2); }

/* Word sync */
.song { display: grid; grid-template-columns: minmax(0, 1fr) minmax(56px, 120px) 84px; gap: 10px; align-items: center; font-size: 12.5px; }
.song > span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.song .bar { height: 7px; }
.song .bar i { background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
.song .bar i.soft { background: rgba(124, 108, 255, 0.25); }
.song.met .bar i:not(.soft) { background: linear-gradient(90deg, #10b981, var(--ok)); }
.goal { position: absolute; top: -3px; bottom: -3px; width: 2px; border-radius: 1px; background: var(--ink-2); }
.song .n { text-align: right; font-size: 11.5px; color: var(--ink-3); white-space: nowrap; }
.song .n b { color: var(--ink); font-weight: 600; margin-right: 4px; }
.song.met .n b { color: var(--ok); }

footer { display: flex; justify-content: space-between; gap: 10px; font-size: 11px; color: var(--ink-3); padding: 0 2px; }
.ok { color: var(--ok); } .warn { color: var(--warn); }
@media (max-width: 380px) { .song { grid-template-columns: minmax(0, 1fr) 70px 78px; } .win { grid-template-columns: 46px minmax(0, 1fr) 38px; } }
</style>

<main>
  <header>
    <div class="mark"><svg viewBox="0 0 16 16" fill="#fff"><rect x="1.5" y="6" width="2" height="4" rx="1"/><rect x="5" y="3" width="2" height="10" rx="1"/><rect x="8.5" y="5" width="2" height="6" rx="1"/><rect x="12" y="2" width="2" height="12" rx="1"/></svg></div>
    <div><h1>Living Lyrics</h1><div class="sub" id="sub">штаб</div></div>
    <span class="live stale" id="live"><i></i><span id="live-t">ждём Станцию</span></span>

  <div id="root"><section><span class="none">Состояние появится, как только Станция его пришлёт: обычно в течение двух минут.</span></section></div>
</main>

<script>
const ICON = {};
document.getElementById('icons').content.querySelectorAll('span').forEach(s => { ICON[s.dataset.k] = s.innerHTML; });
const CHAT = { working: 'работает', waiting: 'ждёт ответа', idle: 'свободен', retired: 'спит', none: 'не запущен' };
const STALE_MIN = 45;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const level = used => (used >= 90 ? 'bad' : used >= 75 ? 'warn' : '');
let last = null;

function dur(m) {
  if (m === null || m === undefined) return '';
  if (m < 1) return 'меньше минуты';
  if (m < 60) return `${m} мин`;
  if (m < 1440) return `${Math.floor(m / 60)} ч ${m % 60 ? `${m % 60} мин` : ''}`.trim();
  return `${Math.floor(m / 1440)} дн ${Math.floor((m % 1440) / 60)} ч`;
}
function minutesSince(iso) {
  const t = Date.parse(iso || '');
  return Number.isNaN(t) ? null : Math.max(0, Math.round((Date.now() - t) / 60000));
}
function hhmm(iso) {
  const t = new Date(iso || '');
  return Number.isNaN(t.getTime()) ? '' : t.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
}

/** A 7-day sparkline of one window: area, line, the latest point; the time span is the data's own when shorter. */
function spark(trend, key, color) {
  const pts = (trend || []).filter(p => typeof p[key] === 'number');
  if (pts.length < 2) return '';
  const t0 = pts[0].t, t1 = pts[pts.length - 1].t, span = Math.max(1, t1 - t0);
  const W = 200, H = 30;
  const xy = pts.map(p => [((p.t - t0) / span) * W, H - (Math.min(100, p[key]) / 100) * H]);
  const line = xy.map(([x, y], i) => `${i ? 'L' : 'M'}${x.toFixed(1)},${y.toFixed(1)}`).join('');
  const [ex, ey] = xy[xy.length - 1];
  const id = `g${key}`;
  const days = span / 86400000;
  const label = days >= 1 ? `${days >= 6.5 ? 7 : Math.round(days) || 1} дн` : `${Math.max(1, Math.round(span / 3600000))} ч`;
  return `<div class="spark"><span>${label}</span><svg viewBox="0 -2 ${W} ${H + 4}" preserveAspectRatio="none">
    <defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".35"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <line x1="0" x2="${W}" y1="${H}" y2="${H}" stroke="rgba(255,255,255,.08)" stroke-width="1" vector-effect="non-scaling-stroke"/>
    <path d="${line}L${W},${H}L0,${H}Z" fill="url(#${id})"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
    <circle cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" r="2.6" fill="${color}"/></svg></div>`;
}

/** Grok has no plan windows to show: tokens per day for the last seven days, from the samples. */
function grokDays(trend) {
  const byDay = new Map();
  for (const p of trend || []) {
    if (typeof p.gk !== 'number') continue;
    const d = new Date(p.t).toDateString();
    byDay.set(d, Math.max(byDay.get(d) || 0, p.gk));
  }
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(Date.now() - i * 86400000);
    days.push({ label: d.toLocaleDateString('ru-RU', { weekday: 'short' }).replace('.', ''), v: byDay.get(d.toDateString()) || 0, today: i === 0 });
  }
  const max = Math.max(1, ...days.map(d => d.v));
  if (!days.some(d => d.v)) return '';
  return `<div class="days">${days.map(d => `<i class="${d.today ? 'today' : d.v ? '' : 'zero'}" style="height:${d.v ? Math.max(8, (d.v / max) * 100) : 0}%" title="${d.v}"></i>`).join('')}</div>
    <div class="days-l">${days.map(d => `<span>${esc(d.label)}</span>`).join('')}</div>`;
}

/** 'сброс через 4h 47m' → 'сброс через 4 ч 47 мин', 'через 88h 53m' → 'сброс через 3 дн 17 ч'. */
function resetText(text) {
  const m = text.match(/через\s+(?:(\d+)d\s*)?(?:(\d+)h)?\s*(?:(\d+)m)?/);
  if (!m) return text;
  const min = (Number(m[1] || 0) * 24 + Number(m[2] || 0)) * 60 + Number(m[3] || 0);
  return `сброс через ${dur(min)}`;
}

function windowRows(list, color, trend, keys) {
  if (!list || !list.length) return '<span class="none">нет данных</span>';
  return list.map((w, i) => `<div class="win"><span>${esc(w.label)}</span><span class="bar" style="--c:${color}"><i class="${level(w.used)}" style="width:${Math.min(100, Math.max(0, w.used))}%"></i></span><span class="n">${Math.round(w.used)} %</span>${w.reset ? `<span class="reset">${esc(resetText(w.reset))}</span>` : ''}</div>`).join('')
    + (keys || []).map(k => spark(trend, k, color)).join('');
}

function render(d) {
  last = d;
  if (!d) return;
  const m = minutesSince(d.at);
  const stale = m === null || m > STALE_MIN;
  const live = document.getElementById('live');
  live.classList.toggle('stale', stale);
  document.getElementById('live-t').textContent = stale ? (m === null ? 'нет данных' : `Станция молчит ${dur(m)}`) : 'онлайн';
  document.getElementById('sub').textContent = `штаб · обновлено ${m === null ? '—' : m < 1 ? 'только что' : `${dur(m)} назад`}`;

  const out = [];
  const L = d.limits || {}, P = L.plans || {}, trend = d.trend || [];

  const you = d.you || [];
  if (you.length) out.push(`<section class="you"><h2><span class="badge">${you.length}</span>Нужно от вас</h2><ul>${you.map(t => `<li><b>${esc(t.title)}</b>${t.how ? `<span>${esc(t.how)}</span>` : ''}</li>`).join('')}</ul></section>`);

  if (d.roadmap) {
    const steps = d.steps || [];
    const segs = steps.map(s => `<span class="seg ${s.done >= 1 ? 'done' : ''}" style="flex:${s.weight}"><i style="width:${Math.round(s.done * 100)}%"></i></span>`).join('');
    const list = steps.filter(s => s.done < 1).map(s => `<div class="step ${s.done > 0 ? 'part' : ''}"><span class="tick"></span><span>${esc(s.name)}</span><span class="n">${Math.round(s.done * 100)} %</span></div>`).join('');
    const doneN = steps.filter(s => s.done >= 1).length;
    out.push(`<section><div class="road-top"><b>${esc(d.roadmap.title)}</b><span class="n">${d.roadmap.percent} %</span></div>${segs ? `<div class="segs">${segs}</div>` : ''}
      ${steps.length ? `<div class="steps"><div class="step done"><span class="tick">✓</span><span>готово шагов: ${doneN} из ${steps.length}</span><span></span></div>${list}</div>` : ''}</section>`);
  }

  const g = L.grok;
  out.push(`<section><h2>Лимиты <span>за неделю</span></h2>
    <div class="svc"><div class="svc-h"><i class="ic">${ICON.claude}</i><b>Claude</b><small>${esc(P.claude)}</small></div>${windowRows(L.claude, 'var(--claude)', trend, ['c5', 'cw'].filter(k => trend.some(p => typeof p[k] === 'number')).slice(-1))}</div>
    <div class="svc"><div class="svc-h"><i class="ic">${ICON.gemini}</i><b>Gemini</b><small>${esc(P.gemini)}</small></div>${windowRows(L.gemini, 'var(--gemini)', trend, ['gw'].filter(k => trend.some(p => typeof p[k] === 'number')))}</div>
    <div class="svc"><div class="svc-h"><i class="ic">${ICON.grok}</i><b>Grok</b><small>${esc(g && g.plan)}</small></div>
      ${g ? `<div class="kv"><span class="big n">${esc(g.today)}</span><span>токенов сегодня${g.week ? ` · ${esc(g.week)} за 7 дней` : ''}</span></div>${grokDays(trend)}<span class="none">окон лимита xAI не сообщает</span>` : '<span class="none">нет данных</span>'}</div>
  </section>`);

  const chats = d.chats || [];
  const agents = (d.agents || []).filter(r => r.agent !== 'claude');
  const runs = d.runs || [];
  const rows = agents.map(r => `<div class="ag"><i class="ic">${ICON[r.agent] || ''}</i><div class="who"><b>${esc(r.name)}</b><span>${esc(r.task)}</span></div>${r.state ? `<em class="chip ${esc(r.tone)}">${esc(r.state)}</em>` : '<span></span>'}
      ${r.age !== null && r.age !== undefined ? `<div class="meta">сессия идёт ${esc(dur(r.age))}</div>` : ''}${r.detail ? `<div class="det">${esc(r.detail)}</div>` : ''}</div>`);
  for (const run of runs) rows.push(`<div class="ag"><i class="ic gh">${ICON.github}</i><div class="who"><b>GitHub · ${esc(run.name)}</b><span>${esc(run.title)}</span></div><em class="chip working">${esc(dur(run.minutes))}</em></div>`);
  out.push(`<section><h2>Чаты <span>${chats.filter(c => c.state === 'working').length} из ${chats.length} работают</span></h2>
    ${chats.length ? `<div class="chats">${chats.map(c => `<div class="chat"><span class="dot ${esc(c.state)}"></span><b>${esc(c.name.replace(/^LL · /, ''))}</b><span class="st">${esc(CHAT[c.state] || c.state)}${c.minutes !== null && c.minutes !== undefined ? ` · ${esc(dur(c.minutes))}` : ''}</span></div>`).join('')}</div>` : '<span class="none">нет данных о чатах</span>'}
  </section>`);
  out.push(`<section><h2>Исполнители <span>${rows.length ? `${rows.length} в деле` : ''}</span></h2>${rows.length ? `<div class="ags">${rows.join('')}</div>` : '<span class="none">Исполнители сейчас не заняты.</span>'}</section>`);

  const songs = d.songs || [];
  if (songs.length) out.push(`<section><h2>Подсветка по словам <span>${d.goal ? `цель ${d.goal} %` : ''}</span></h2>${songs.map(s => {
    const p = s.total ? s.proven / s.total : 0, pl = s.total ? Math.max(p, (s.placed ?? s.proven) / s.total) : 0, pct = Math.round(p * 100);
    return `<div class="song${d.goal && pct >= d.goal ? ' met' : ''}"><span>${esc(s.label)}</span><span class="bar"><i class="soft" style="width:${(pl * 100).toFixed(1)}%"></i><i style="width:${(p * 100).toFixed(1)}%"></i>${d.goal ? `<span class="goal" style="left:calc(${d.goal}% - 1px)"></span>` : ''}</span><span class="n"><b>${pct} %</b>${s.proven}/${s.total}</span></div>`;
  }).join('')}</section>`);

  const h = d.hygiene;
  out.push(`<footer><span>${h ? (h.issues && h.issues.length ? `<span class="warn" title="${esc(h.issues.join('\n'))}">Порядок: ${h.issues.length + (h.more || 0)} на заметку</span>` : '<span class="ok">Порядок: чисто</span>') : ''}</span><span>данные Станции · ${esc(hhmm(d.at))}</span></footer>`);
  document.getElementById('root').innerHTML = `<div style="display:grid;gap:10px">${out.join('')}</div>`;
}

setInterval(() => render(last), 30000);

(async () => {
  const db = window.claude && await claude.use('db');
  if (!db) { document.getElementById('live-t').textContent = 'войдите в claude.ai'; return; }
  db.doc('dashboard/now').onSnapshot(snap => render(snap && snap.exists ? snap.data() : null), () => { document.getElementById('live-t').textContent = 'нет связи'; });
})();
</script>
