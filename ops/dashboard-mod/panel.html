<title>Living Lyrics Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a narrow control-room column beside a chat; summary first (owner, limits), then who works, then progress. Colour carries state and brand. */
:root {
  --bg: #eef1f6; --card: #ffffff; --sunk: #f4f6fa; --ink: #141821; --ink-2: #4f5a6b; --ink-3: #8b94a3; --line: rgba(20, 32, 56, 0.09);
  --accent: #4f5bd5; --accent-soft: rgba(79, 91, 213, 0.16);
  --claude: #d97757; --gemini: #3186ff; --grok: #20242c; --gh: #4f5a6b;
  --ok: #1f9d5c; --ok-soft: rgba(31, 157, 92, 0.13); --warn: #d17b0f; --warn-soft: rgba(209, 123, 15, 0.14);
  --bad: #d23f3f; --idle-soft: rgba(79, 90, 107, 0.1); --review-soft: rgba(79, 91, 213, 0.13);
  --you: #fff4e2; --you-line: #f2c27a; --you-ink: #8a4b00;
  --sans: 'Golos Text', -apple-system, 'Segoe UI', system-ui, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1117; --card: #161a22; --sunk: #1c212b; --ink: #e9edf4; --ink-2: #aab3c2; --ink-3: #6f7889; --line: rgba(233, 237, 244, 0.08);
    --accent: #8e98ff; --accent-soft: rgba(142, 152, 255, 0.2);
    --claude: #e8896a; --gemini: #5c9dff; --grok: #e9edf4; --gh: #aab3c2;
    --ok: #3cc47e; --ok-soft: rgba(60, 196, 126, 0.16); --warn: #f0a540; --warn-soft: rgba(240, 165, 64, 0.16);
    --bad: #f06464; --idle-soft: rgba(170, 179, 194, 0.12); --review-soft: rgba(142, 152, 255, 0.18);
    --you: #2a2112; --you-line: #7a5520; --you-ink: #f5c27a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1117; --card: #161a22; --sunk: #1c212b; --ink: #e9edf4; --ink-2: #aab3c2; --ink-3: #6f7889; --line: rgba(233, 237, 244, 0.08);
  --accent: #8e98ff; --accent-soft: rgba(142, 152, 255, 0.2);
  --claude: #e8896a; --gemini: #5c9dff; --grok: #e9edf4; --gh: #aab3c2;
  --ok: #3cc47e; --ok-soft: rgba(60, 196, 126, 0.16); --warn: #f0a540; --warn-soft: rgba(240, 165, 64, 0.16);
  --bad: #f06464; --idle-soft: rgba(170, 179, 194, 0.12); --review-soft: rgba(142, 152, 255, 0.18);
  --you: #2a2112; --you-line: #7a5520; --you-ink: #f5c27a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 13.5px; line-height: 1.38; }
main { max-width: 540px; margin: 0 auto; padding-block: 12px 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 8px; }
.num { font-family: var(--mono); font-size: 11.5px; font-variant-numeric: tabular-nums; }

/* Header */
header { display: grid; gap: 6px; padding: 2px 2px 4px; }
.top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
h1 { font-size: 16px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
.live { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-3); font-size: 12px; margin-left: auto; }
.live i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }
.live.stale { color: var(--warn); }
.live.stale i { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-soft); }
.road { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 12px; color: var(--ink-2); }
.road .track { height: 4px; }

/* Blocks */
section { background: var(--card); border-radius: 12px; padding: 9px 11px; display: grid; gap: 7px; box-shadow: 0 0 0 1px var(--line); min-width: 0; }
h2 { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.09em; color: var(--ink-3); margin: 0; display: flex; justify-content: space-between; gap: 8px; }
h2 span { text-transform: none; letter-spacing: 0; font-weight: 500; }
.empty { color: var(--ink-3); font-size: 12.5px; }

.you { background: var(--you); box-shadow: 0 0 0 1px var(--you-line); }
.you h2 { color: var(--you-ink); }
.you ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 5px; }
.you li { display: grid; gap: 1px; }
.you b { font-weight: 600; }
.you small { color: var(--ink-2); font-size: 12px; }

/* Limits: one tile per service */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 6px; }
.tile { background: var(--sunk); border-radius: 9px; padding: 7px 9px; display: grid; gap: 5px; align-content: start; min-width: 0; }
.tile header { display: flex; align-items: center; gap: 6px; padding: 0; font-weight: 600; font-size: 12.5px; }
.tile header small { color: var(--ink-3); font-weight: 400; font-size: 11px; margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.win { display: grid; grid-template-columns: 44px minmax(0, 1fr) 34px; gap: 6px; align-items: center; font-size: 11.5px; color: var(--ink-2); }
.win .num { text-align: right; color: var(--ink); }
.reset { grid-column: 2 / 4; color: var(--ink-3); font-size: 10.5px; margin-top: -3px; }
.track { position: relative; height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
.track i { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: var(--c, var(--accent)); }
.track i.warn { background: var(--warn); }
.track i.bad { background: var(--bad); }
.kv { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--ink-2); }
.kv .num { color: var(--ink); }

/* Chats and executors */
.chats { display: flex; flex-wrap: wrap; gap: 5px; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px 2px 6px; border-radius: 999px; background: var(--sunk); font-size: 12px; }
.pill small { color: var(--ink-3); font-size: 11px; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); flex: none; }
.dot.working { background: var(--ok); }
.dot.waiting, .dot.stalled { background: var(--warn); }
.dot.retired, .dot.none { background: transparent; box-shadow: inset 0 0 0 1.5px var(--ink-3); }
.agents { display: grid; }
.agent { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 1px 8px; align-items: center; padding: 6px 0; }
.agent + .agent { border-top: 1px solid var(--line); }
.agent .ic { width: 16px; height: 16px; color: var(--ink-2); }
.agent .ic svg { width: 16px; height: 16px; display: block; }
.agent .name { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.agent .name b { font-weight: 600; }
.agent .name span { color: var(--ink-2); }
.agent .detail { grid-column: 2 / 4; color: var(--ink-3); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip { font-size: 11px; font-weight: 500; padding: 1px 7px; border-radius: 999px; white-space: nowrap; background: var(--idle-soft); color: var(--ink-2); }
.chip.working { background: var(--ok-soft); color: var(--ok); }
.chip.stalled { background: var(--warn-soft); color: var(--warn); }
.chip.review { background: var(--review-soft); color: var(--accent); }

/* Word sync */
.song { display: grid; grid-template-columns: minmax(0, 1fr) minmax(70px, 120px) 74px; gap: 8px; align-items: center; font-size: 12.5px; }
.song > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.song .num { text-align: right; color: var(--ink-2); }
.song .num b { color: var(--ink); font-weight: 500; }
.song .track { overflow: visible; height: 6px; }
.song .track .placed { background: var(--accent-soft); }
.song .track .proven { background: var(--accent); }
.song.met .track .proven { background: var(--ok); }
.goal { position: absolute; top: -3px; width: 2px; height: 12px; border-radius: 1px; background: var(--ink-3); }
.hyg { font-size: 12px; color: var(--ink-2); display: grid; gap: 2px; }
.hyg div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>

<main>
  <header>
    <div class="top">
      <h1>Living Lyrics</h1>
      <span class="live stale" id="live"><i></i><span id="age">ждём первую запись со Станции</span></span>
    </div>
    <div class="road" id="road" hidden><span id="road-title"></span><span class="track"><i id="road-bar" style="width:0"></i></span><span class="num" id="road-pct"></span></div>
  </header>
  <section class="you" id="you" hidden><h2>Нужно от вас</h2><ul id="you-list"></ul></section>
  <section id="limits-box" hidden><h2>Лимиты</h2><div class="tiles" id="limits"></div></section>
  <section><h2>Кто работает <span id="chats-note"></span></h2><div class="chats" id="chats"></div><div class="agents" id="agents"><span class="empty">Состояние появится, когда Станция его пришлёт.</span></div></section>
  <section id="songs-box" hidden><h2>Подсветка по словам <span id="goal"></span></h2><div id="songs"></div></section>
  <section id="hyg-box" hidden><h2>Порядок <span id="hyg-note"></span></h2><div class="hyg" id="hyg"></div></section>
</main>

<script>
const ICON = {};
document.getElementById('icons').content.querySelectorAll('span').forEach(s => { ICON[s.dataset.k] = s.innerHTML; });
const CHAT = { working: 'работает', waiting: 'ждёт ответа', idle: 'свободен', retired: 'спит', none: 'не запущен' };
const STALE_MIN = 45;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let last = null;

function minutesSince(iso) {
  const t = Date.parse(iso || '');
  return Number.isNaN(t) ? null : Math.max(0, Math.round((Date.now() - t) / 60000));
}
function agoText(m) {
  if (m === null) return '';
  if (m < 1) return 'обновлено только что';
  if (m < 60) return `обновлено ${m} мин назад`;
  return `обновлено ${Math.floor(m / 60)} ч ${m % 60} мин назад`;
}
const level = used => (used >= 90 ? 'bad' : used >= 75 ? 'warn' : '');
const meter = (used, color) => `<span class="track" style="--c:${color}"><i class="${level(used)}" style="width:${Math.min(100, Math.max(0, used))}%"></i></span>`;

function tile(key, name, plan, body) {
  return `<div class="tile"><header><span class="ic" style="width:14px;height:14px;display:inline-flex;color:var(--grok)">${ICON[key]}</span>${name}${plan ? `<small>${esc(plan)}</small>` : ''}</header>${body}</div>`;
}
function windows(list, color) {
  if (!list || !list.length) return '<span class="empty">нет данных</span>';
  return list.map(w => `<div class="win"><span>${esc(w.label)}</span>${meter(w.used, color)}<span class="num">${Math.round(w.used)} %</span>${w.reset ? `<span class="reset">${esc(w.reset)}</span>` : ''}</div>`).join('');
}

function render(d) {
  last = d;
  if (!d) return;
  const m = minutesSince(d.at);
  const stale = m === null || m > STALE_MIN;
  $('live').classList.toggle('stale', stale);
  $('age').textContent = agoText(m) + (stale && m !== null ? ' · Станция молчит' : '');

  $('road').hidden = !d.roadmap;
  if (d.roadmap) {
    $('road-title').textContent = d.roadmap.title;
    $('road-bar').style.width = `${d.roadmap.percent}%`;
    $('road-pct').textContent = `${d.roadmap.percent} %`;
  }

  const you = d.you || [];
  $('you').hidden = !you.length;
  $('you-list').innerHTML = you.map(t => `<li><b>${esc(t.title)}</b>${t.how ? `<small>${esc(t.how)}</small>` : ''}</li>`).join('');

  const L = d.limits || {};
  const P = L.plans || {};
  const tiles = [tile('claude', 'Claude', P.claude, windows(L.claude, 'var(--claude)')), tile('gemini', 'Gemini', P.gemini, windows(L.gemini, 'var(--gemini)'))];
  const g = L.grok;
  if (g && typeof g === 'object') tiles.push(tile('grok', 'Grok', g.plan, `<div class="kv"><span>сегодня</span><span class="num">${esc(g.today)} ток.</span></div>${g.week ? `<div class="kv"><span>7 дней</span><span class="num">${esc(g.week)} ток.</span></div>` : ''}`));
  else if (g) tiles.push(tile('grok', 'Grok', '', `<div class="kv"><span>сегодня</span><span class="num">${esc(g)}</span></div>`));
  $('limits-box').hidden = false;
  $('limits').innerHTML = tiles.join('');

  const chats = d.chats || [];
  $('chats').innerHTML = chats.map(c => `<span class="pill"><span class="dot ${esc(c.state)}"></span>${esc(c.name.replace(/^LL · /, ''))} <small>${esc(CHAT[c.state] || c.state)}</small></span>`).join('');
  $('chats').hidden = !chats.length;

  const rows = (d.agents || []).filter(r => r.agent !== 'claude' || r.task).map(r => `
    <div class="agent">
      <span class="ic">${ICON[r.agent] || ''}</span>
      <span class="name" title="${esc(r.task)}"><b>${esc(r.name)}</b>${r.task ? ` <span>· ${esc(r.task)}</span>` : ''}</span>
      ${r.state ? `<span class="chip ${esc(r.tone)}">${esc(r.state)}</span>` : '<span></span>'}
      ${r.detail ? `<span class="detail" title="${esc(r.detail)}">${esc(r.detail)}</span>` : ''}
    </div>`);
  for (const run of d.runs || []) rows.push(`
    <div class="agent">
      <span class="ic">${ICON.github}</span>
      <span class="name" title="${esc(run.title)}"><b>GitHub · ${esc(run.name)}</b> <span>· ${esc(run.title)}</span></span>
      <span class="chip working">идёт · ${run.minutes} мин</span>
    </div>`);
  $('agents').innerHTML = rows.length ? rows.join('') : '<span class="empty">Сейчас никто не работает.</span>';

  const songs = d.songs || [];
  $('songs-box').hidden = !songs.length;
  $('goal').textContent = d.goal ? `цель ${d.goal} %` : '';
  $('songs').innerHTML = songs.map(s => {
    const p = s.total ? s.proven / s.total : 0;
    const pl = s.total ? Math.max(p, (s.placed ?? s.proven) / s.total) : 0;
    const pct = Math.round(p * 100);
    return `<div class="song${d.goal && pct >= d.goal ? ' met' : ''}"><span>${esc(s.label)}</span>
      <span class="track"><i class="placed" style="width:${(pl * 100).toFixed(1)}%"></i><i class="proven" style="width:${(p * 100).toFixed(1)}%"></i>${d.goal ? `<span class="goal" style="left:calc(${d.goal}% - 1px)"></span>` : ''}</span>
      <span class="num"><b>${pct} %</b> ${s.proven}/${s.total}</span></div>`;
  }).join('');

  const h = d.hygiene;
  $('hyg-box').hidden = !h || (!h.fixed && !(h.issues || []).length);
  if (h) {
    $('hyg-note').textContent = h.fixed ? `убрано ${h.fixed}` : '';
    $('hyg').innerHTML = (h.issues || []).map(i => `<div title="${esc(i)}">${esc(i)}</div>`).join('') + (h.more ? `<div>… ещё ${h.more}</div>` : '');
  }
}

setInterval(() => render(last), 30000);

(async () => {
  const db = await claude.use('db');
  if (!db) { $('age').textContent = 'войдите в claude.ai, чтобы видеть состояние'; return; }
  db.doc('dashboard/now').onSnapshot(snap => render(snap && snap.exists ? snap.data() : null), () => { $('age').textContent = 'нет связи с базой страницы'; });
})();
</script>
