# Audio pipeline on GitHub's runners (public repository: free, 4 CPU, 16 GB RAM).
#
# Start: push a job file jobs/<slug>.json, for example {"stages": ["separate", "align", "qa"]},
# or Actions → pipeline → Run workflow. Result: one commit with the updated lyrics.json and song.json,
# docs/analysis/<slug>-qa.md, docs/analysis/<slug>/ (sections, transcript, locator) and the job file removed.
# work/ is not committed. Procedure for agents:
# docs/methodology/05-alignment.md. Stages features and instruments add public/audio/<slug>/features.json
# and docs/analysis/<slug>-instruments.json / .md (docs/methodology/09-instruments.md). They do not
# edit lyrics.json; the agent copies confirmed entrances afterwards.
#
# Job file fields: "stages" (decrypt separate sections transcribe diagnose bench align qa features instruments).
# Before any align, the run collects a score row per cued line and writes docs/analysis/bench/calibration.json.
# Jobs do not list that stage. A failed calibration does not fall through to the old 0.30 gate.
# After every align and before qa, the run writes docs/analysis/bench/aligner-review.json
# (who is closer to a strong attack, the second aligner's shift, borrowed models) and then
# measures the per-song witness rule, word refutations and the line share
# (docs/analysis/bench/attack-chance.json). A cued line the first MMS pass missed is placed
# by the first later step that still passes structure and 0.30 s: another MMS window, an
# htdemucs_ft clip of that line, stable-ts, then the second aligner. Line chance is measured
# per placer. A placer still over 5 % at K = 1 is excluded from proof; the run continues
# when the others fit. qa reads that rule and does not prove an excluded placer.
# A word start must sit inside the line's section (0.05 s), or that chain step
# does not place the line. stable-ts measures every Whisper model that finishes
# inside 90 minutes, on windows of lines already placed, and keeps each clock.
# The largest of those places lines still open. The proof witness is chosen
# per song and language by proved lines, after aligner-review and before the
# attack measurement.
# The phoneme witness is measured in the align job (espeak-ng and wav2vec2,
# 30 minutes, PHONEME_BUDGET_S). The prove job admits it from those clocks.
# It does not run the model and does not install espeak-ng. Weights are not committed.
# A failed measurement does not fall through to the 0.10 s attack test.
# The align artifact also carries the encrypted four-stem cache. Prove unpacks
# that before it falls back to the Actions cache. If the vocal stem is still
# missing, prove separates the recording and does not skip the review.
# Run 39332050100 saved large per-song model caches and the stem cache was
# gone by the time prove started. A qa job may set "align_from_run" to a
# finished run id: prove downloads that run's align artifacts and does not
# align again. Do not combine align_from_run with an align stage.
# An align job is one song. Run 39102852010 put three ladders in one 150 minute
# job and was cancelled at the limit (I Have Come Alive and Karitas had aligned,
# ONE was still inside large-v3, qa had not started). The commit step still
# pushed that partial tree. Align jobs now upload artifacts and do not commit.
# The prove job commits only after every song has aligned, then measures the
# rule once on all of them. 90 minutes plus the separate 15 minute unplaced
# pass still ends inside 120 minutes on the times from that cancelled run.
# optional "align" and "qa" — lists of extra options for align.py / qa_sync.py, e.g. {"qa": ["--fix"]}.
# Needs the repository secret AUDIO_KEY (Settings → Secrets and variables → Actions).
name: pipeline

on:
  push:
    paths: ['jobs/*.json']
  workflow_dispatch:
    inputs:
      slug:
        description: 'Песня (slug)'
        required: true
      stages:
        description: 'Стадии через пробел'
        default: 'separate align qa'

permissions:
  contents: write
  actions: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      count: ${{ steps.jobs.outputs.count }}
      align_count: ${{ steps.jobs.outputs.align_count }}
      slugs: ${{ steps.jobs.outputs.slugs }}
      align_slugs: ${{ steps.jobs.outputs.align_slugs }}
      align_files: ${{ steps.jobs.outputs.align_files }}
      align_matrix: ${{ steps.jobs.outputs.align_matrix }}
      prove_slugs: ${{ steps.jobs.outputs.prove_slugs }}
      prove_files: ${{ steps.jobs.outputs.prove_files }}
      reuse_run: ${{ steps.jobs.outputs.reuse_run }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect jobs
        id: jobs
        env:
          INPUT_SLUG: ${{ inputs.slug }}
          INPUT_STAGES: ${{ inputs.stages }}
        run: |
          python3 - <<'EOF'
          import json, os, pathlib, re
          jobs = []
          slug_in = (os.environ.get('INPUT_SLUG') or '').strip()
          if slug_in:
              jobs.append({'slug': slug_in, 'stages': (os.environ.get('INPUT_STAGES') or '').split(),
                           'align': [], 'qa': [], 'file': ''})
          else:
              for p in sorted(pathlib.Path('jobs').glob('*.json')):
                  try:
                      d = json.loads(p.read_text(encoding='utf-8'))
                  except ValueError as e:
                      print(f'::error file={p}::не JSON: {e}')
                      continue
                  jobs.append({'slug': d.get('slug', p.stem), 'stages': d.get('stages', ['separate', 'align', 'qa']),
                               'align': d.get('align', []), 'qa': d.get('qa', []),
                               'align_from_run': str(d.get('align_from_run') or '').strip(), 'file': str(p)})
          ok = []
          for j in jobs:
              if not re.fullmatch(r'[a-z0-9-]+', j['slug']) or not pathlib.Path('content/songs', j['slug']).is_dir():
                  print(f"::error::нет песни content/songs/{j['slug']}")
                  continue
              ok.append(j)
          align_jobs = [j for j in ok if 'align' in j.get('stages', [])]
          reuse_jobs = []
          for j in ok:
              rid = str(j.get('align_from_run') or '').strip()
              if not rid:
                  continue
              if not re.fullmatch(r'[0-9]+', rid):
                  print(f"::error::align_from_run не число: {j['slug']}")
                  raise SystemExit(1)
              reuse_jobs.append(j)
          reuse_ids = {str(j.get('align_from_run')).strip() for j in reuse_jobs}
          if reuse_jobs and align_jobs:
              print('::error::align_from_run и стадия align в одном запуске')
              raise SystemExit(1)
          if len(reuse_ids) > 1:
              print('::error::разные align_from_run')
              raise SystemExit(1)
          reuse_run = next(iter(reuse_ids)) if reuse_ids else ''
          prove_jobs = align_jobs or reuse_jobs
          include = []
          for j in align_jobs:
              stages = [s for s in j['stages'] if s not in ('qa', 'calibrate')]
              include.append({'slug': j['slug'], 'stages': ' '.join(stages),
                              'align': ' '.join(j.get('align') or []), 'file': j['file']})
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f"count={len(ok)}\n")
              f.write(f"align_count={len(align_jobs)}\n")
              f.write(f"slugs={' '.join(j['slug'] for j in ok)}\n")
              f.write(f"align_slugs={' '.join(j['slug'] for j in align_jobs)}\n")
              f.write(f"align_files={' '.join(j['file'] for j in align_jobs if j['file'])}\n")
              f.write(f"prove_slugs={' '.join(j['slug'] for j in prove_jobs)}\n")
              f.write(f"prove_files={' '.join(j['file'] for j in prove_jobs if j['file'])}\n")
              f.write(f"reuse_run={reuse_run}\n")
              f.write('align_matrix=' + json.dumps({'include': include}, separators=(',', ':')) + '\n')
          print(json.dumps({'align': include, 'reuse_run': reuse_run,
                            'prove': [j['slug'] for j in prove_jobs]}, ensure_ascii=False, indent=1))
          EOF

  run:
    needs: prepare
    if: needs.prepare.outputs.align_count == '0' && needs.prepare.outputs.count != '0' && needs.prepare.outputs.reuse_run == ''
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      AUDIO_KEY: ${{ secrets.AUDIO_KEY }}
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Check the AUDIO_KEY secret
        run: |
          if [ -z "$AUDIO_KEY" ]; then
            echo "::error title=Нет секрета AUDIO_KEY::Записи в репозитории зашифрованы. Добавьте секрет: Settings → Secrets and variables → Actions → New repository secret, имя AUDIO_KEY, значение — как у переменной AUDIO_KEY в Vercel (64 шестнадцатеричных знака). Потом запустите задание снова."
            exit 1
          fi
          if ! [[ "$AUDIO_KEY" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error title=AUDIO_KEY неверного вида::Ожидается 64 шестнадцатеричных знака (32 байта)."
            exit 1
          fi

      - name: Collect jobs
        id: jobs
        env:
          INPUT_SLUG: ${{ inputs.slug }}
          INPUT_STAGES: ${{ inputs.stages }}
        run: |
          python3 - <<'EOF'
          import json, os, pathlib, re
          jobs = []
          if os.environ.get('INPUT_SLUG'):
              jobs.append({'slug': os.environ['INPUT_SLUG'].strip(), 'stages': os.environ.get('INPUT_STAGES', '').split(), 'file': ''})
          else:
              for p in sorted(pathlib.Path('jobs').glob('*.json')):
                  try:
                      d = json.loads(p.read_text(encoding='utf-8'))
                  except ValueError as e:
                      print(f'::error file={p}::не JSON: {e}')
                      continue
                  jobs.append({'slug': d.get('slug', p.stem), 'stages': d.get('stages', ['separate', 'align', 'qa']),
                               'align': d.get('align', []), 'qa': d.get('qa', []), 'file': str(p)})
          ok = []
          for j in jobs:
              if not re.fullmatch(r'[a-z0-9-]+', j['slug']) or not pathlib.Path('content/songs', j['slug']).is_dir():
                  print(f"::error::нет песни content/songs/{j['slug']}")
                  continue
              ok.append(j)
          pathlib.Path('/tmp/jobs.json').write_text(json.dumps(ok))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"count={len(ok)}\n")
              f.write(f"slugs={' '.join(j['slug'] for j in ok)}\n")
          print(json.dumps(ok, indent=1))
          EOF

      - uses: actions/setup-python@v5
        if: steps.jobs.outputs.count != '0'
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/pipeline/requirements.txt

      - name: Cache models (Demucs, MMS_FA, Whisper, CLAP, beat_this)
        if: steps.jobs.outputs.count != '0'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/torch
            ~/.cache/huggingface
            ~/.cache/whisper
          key: models-v1-${{ hashFiles('scripts/pipeline/requirements.txt') }}
          restore-keys: models-v1-

      - name: Cache Demucs stems (encrypted, four stems)
        if: steps.jobs.outputs.count != '0'
        uses: actions/cache@v4
        with:
          path: work/stem-cache
          # v1 held vocals only. Do not restore it: a partial cache must not skip four-stem Demucs.
          key: stems-htdemucs4-v1-${{ github.run_id }}
          restore-keys: stems-htdemucs4-v1-

      - name: Install ffmpeg and Python packages
        if: steps.jobs.outputs.count != '0'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r scripts/pipeline/requirements.txt
          # stable-ts is the third word clock on a song run and on the bench. It is not in
          # requirements.txt. The espeak-ng binary is the phoneme witness on an align
          # job. The phonemizer package, audio-separator and NeMo stay bench-only:
          # they break the transformers import the song job needs. CPU torch is installed
          # again afterwards so none of them can swap in a CUDA wheel.
          if python3 -c "import json,sys; jobs=json.load(open('/tmp/jobs.json')); sys.exit(0 if any('align' in j.get('stages',[]) or 'bench' in j.get('stages',[]) for j in jobs) else 1)"; then
            python -m pip install stable-ts
            sudo apt-get install -y -q espeak-ng
          fi
          if python3 -c "import json,sys; jobs=json.load(open('/tmp/jobs.json')); sys.exit(0 if any('bench' in j.get('stages',[]) for j in jobs) else 1)"; then
            python -m pip install phonemizer 'audio-separator[cpu]'
            python -m pip install 'nemo_toolkit[asr]' || echo 'nemo: пакет на CPU не встал'
          fi
          python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -c "import torch; print('torch', torch.__version__, 'cuda', torch.cuda.is_available()); raise SystemExit('+cu' in torch.__version__)"

      - name: Run stages
        id: run
        if: steps.jobs.outputs.count != '0'
        run: |
          set +e  # one failing song must not stop the others; run.sh reports through its exit code
          worst=0
          : > /tmp/summary.txt
          # Trailing newline: `while read` skips a last line that does not end with one,
          # and the last song would be left out of the threshold (run 39069466435 dropped ONE).
          python3 -c "import json; jobs=json.load(open('/tmp/jobs.json')); open('/tmp/calibrate.txt','w').write('\n'.join(j['slug'] for j in jobs if 'align' in j.get('stages', [])) + '\n')"
          cal_rc=0
          if [ -s /tmp/calibrate.txt ]; then
            while read -r slug; do
              [ -z "$slug" ] && continue
              echo "::group::$slug: calibrate"
              (cd scripts/pipeline && python3 stem_cache.py unpack "$slug" ../../work/stem-cache) < /dev/null
              bash scripts/pipeline/sandbox/run.sh "$slug" calibrate < /dev/null
              rc=$?
              echo "::endgroup::"
              echo "$slug calibrate: код $rc" >> /tmp/summary.txt
              if [ $rc -ge 2 ]; then
                cal_rc=2
                echo "::error::$slug: калибровка не собрала оценки"
              fi
            done < /tmp/calibrate.txt
            if [ $cal_rc -eq 0 ]; then
              python3 scripts/pipeline/calibrate_score.py --choose
              rc=$?
              if [ $rc -ne 0 ]; then
                cal_rc=2
                echo "::error::порог по репликам не выбран"
              else
                python3 - <<'PY'
          import json
          from pathlib import Path
          want = [s for s in Path('/tmp/calibrate.txt').read_text(encoding='utf-8').split() if s]
          data = json.loads(Path('docs/analysis/bench/calibration.json').read_text(encoding='utf-8'))
          have = {Path(src).parent.name for src in data.get('sources', [])}
          missing = [s for s in want if s not in have]
          if missing:
              raise SystemExit('в калибровке нет песен: ' + ', '.join(missing))
          print('калибровка покрывает: ' + ' '.join(want))
          PY
                rc=$?
                if [ $rc -ne 0 ]; then
                  cal_rc=2
                  echo "::error::калибровка собрана не по всем песням"
                fi
              fi
            fi
          fi
          if [ $cal_rc -ge 2 ]; then
            echo "калибровка не прошла, выравнивание не запускалось" >> /tmp/summary.txt
            echo "worst=2" >> "$GITHUB_OUTPUT"
            cat /tmp/summary.txt >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 -c "import json; [print(j['slug'], ' '.join(j['stages']), '|', ' '.join(j.get('align', [])), '|', ' '.join(j.get('qa', []))) for j in json.load(open('/tmp/jobs.json'))]" > /tmp/jobs.txt
          # Align every song before qa. The attack measurement has to see all of them,
          # the same way the score threshold does. A qa-only job still runs afterwards.
          : > /tmp/qa-jobs.txt
          align_rc=0
          while IFS='|' read -r head align qa; do
            set -- $head
            slug=$1; shift
            rest=""
            for s in "$@"; do
              if [ "$s" = "qa" ]; then
                printf '%s|%s\n' "$slug" "$qa" >> /tmp/qa-jobs.txt
              else
                rest="$rest $s"
              fi
            done
            if [ -z "$rest" ]; then
              continue
            fi
            echo "::group::$slug:$rest"
            # </dev/null: ffmpeg would otherwise eat the job list this loop reads
            (cd scripts/pipeline && python3 stem_cache.py unpack "$slug" ../../work/stem-cache) < /dev/null
            ALIGN_ARGS="$align" QA_ARGS="$qa" bash scripts/pipeline/sandbox/run.sh "$slug" $rest < /dev/null
            rc=$?
            (cd scripts/pipeline && python3 stem_cache.py pack "$slug" ../../work/stem-cache) < /dev/null
            echo "::endgroup::"
            echo "$slug:$rest код $rc" >> /tmp/summary.txt
            if [ $rc -eq 2 ]; then
              echo "::error::$slug: стадия упала, см. лог шага"
              align_rc=2
              mkdir -p docs/analysis
              { echo "# Конвейер: $slug — ошибка"; echo; echo "Запуск ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}, стадии:$rest."; echo; echo '```'; tail -n 60 "work/$slug/run.log"; echo '```'; } > "docs/analysis/$slug-pipeline.md"
            fi
            [ $rc -gt $worst ] && worst=$rc
          done < /tmp/jobs.txt
          if [ -s /tmp/calibrate.txt ] && [ $align_rc -eq 0 ]; then
            echo "::group::aligner review"
            # shellcheck disable=SC2046
            python3 scripts/pipeline/aligner_review.py --choose $(tr '\n' ' ' < /tmp/calibrate.txt)
            rc=$?
            echo "::endgroup::"
            echo "aligner-review: код $rc" >> /tmp/summary.txt
            if [ $rc -ne 0 ]; then
              align_rc=2
              worst=2
              echo "::error::разбор расхождений не собрался"
            fi
          fi
          if [ -s /tmp/calibrate.txt ] && [ $align_rc -eq 0 ]; then
            echo "::group::attack chance"
            # shellcheck disable=SC2046
            python3 scripts/pipeline/attack_chance.py --choose $(tr '\n' ' ' < /tmp/calibrate.txt)
            rc=$?
            echo "::endgroup::"
            echo "attack-chance: код $rc" >> /tmp/summary.txt
            if [ $rc -ne 0 ]; then
              align_rc=2
              worst=2
              echo "::error::замер атак не выбрал правило"
            else
              python3 - <<'PY'
          import json
          from pathlib import Path
          want = [s for s in Path('/tmp/calibrate.txt').read_text(encoding='utf-8').split() if s]
          data = json.loads(Path('docs/analysis/bench/attack-chance.json').read_text(encoding='utf-8'))
          have = set(data.get('songs') or [])
          missing = [s for s in want if s not in have]
          if missing:
              raise SystemExit('нет замера атак: ' + ', '.join(missing))
          chosen = data.get('chosen') or {}
          if not chosen.get('within_limit'):
              raise SystemExit('случайный проход выше предела: ' + str(chosen.get('chance')))
          print('правило слова: ' + str(chosen.get('name')) + ' случайный проход ' + str(chosen.get('chance')))
          PY
              rc=$?
              if [ $rc -ne 0 ]; then
                align_rc=2
                worst=2
                echo "::error::замер атак не покрыл песни или не уложился в 15 %"
              fi
            fi
          elif [ -s /tmp/calibrate.txt ]; then
            echo "выравнивание или разбор не прошли, проверка не запускалась" >> /tmp/summary.txt
            align_rc=2
            worst=2
          fi
          if [ $align_rc -eq 0 ] && [ -s /tmp/qa-jobs.txt ]; then
            while IFS='|' read -r slug qa; do
              [ -z "$slug" ] && continue
              echo "::group::$slug: qa"
              (cd scripts/pipeline && python3 stem_cache.py unpack "$slug" ../../work/stem-cache) < /dev/null
              PIPELINE_SKIP_PREP=1 QA_ARGS="$qa" bash scripts/pipeline/sandbox/run.sh "$slug" qa < /dev/null
              rc=$?
              (cd scripts/pipeline && python3 stem_cache.py pack "$slug" ../../work/stem-cache) < /dev/null
              echo "::endgroup::"
              echo "$slug qa: код $rc" >> /tmp/summary.txt
              if [ $rc -eq 2 ]; then
                echo "::error::$slug: проверка упала, см. лог шага"
                mkdir -p docs/analysis
                { echo "# Конвейер: $slug — ошибка"; echo; echo "Запуск ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}, стадия: qa."; echo; echo '```'; tail -n 60 "work/$slug/run.log"; echo '```'; } > "docs/analysis/$slug-qa.md"
              fi
              [ $rc -gt $worst ] && worst=$rc
            done < /tmp/qa-jobs.txt
          fi
          echo "worst=$worst" >> "$GITHUB_OUTPUT"
          cat /tmp/summary.txt >> "$GITHUB_STEP_SUMMARY"
          for f in docs/analysis/*-qa.md; do [ -f "$f" ] && { echo; cat "$f"; } >> "$GITHUB_STEP_SUMMARY"; done
          exit 0

      - name: Commit results and remove the job files
        if: always() && steps.jobs.outputs.count != '0'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
          for slug in ${{ steps.jobs.outputs.slugs }}; do
            git add "content/songs/$slug/lyrics.json" "content/songs/$slug/song.json" 2>/dev/null || true
            [ -f "docs/analysis/$slug-qa.md" ] && git add "docs/analysis/$slug-qa.md"
            [ -f "docs/analysis/$slug-pipeline.md" ] && git add "docs/analysis/$slug-pipeline.md"
            [ -f "public/audio/$slug/features.json" ] && git add "public/audio/$slug/features.json"
            [ -f "docs/analysis/$slug-instruments.json" ] && git add "docs/analysis/$slug-instruments.json"
            [ -f "docs/analysis/$slug-instruments.md" ] && git add "docs/analysis/$slug-instruments.md"
            # sections.suggested.json, transcript.json, locate.md. Not work/.
            [ -d "docs/analysis/$slug" ] && git add "docs/analysis/$slug"
          done
          if [ -d docs/analysis/bench ]; then git add docs/analysis/bench; fi
          python3 -c "import json; [print(j['file']) for j in json.load(open('/tmp/jobs.json')) if j['file']]" | while read -r f; do
            git rm -q --ignore-unmatch "$f"
          done
          if git diff --cached --quiet; then echo 'нечего коммитить'; exit 0; fi
          git commit -q -m "pipeline: ${{ steps.jobs.outputs.slugs }}" -m "Run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          for i in 1 2 3; do
            git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          echo '::error::не удалось отправить коммит'; exit 1

      - name: Fail when a stage failed
        if: steps.run.outputs.worst == '2'
        run: exit 1

  calibrate:
    needs: prepare
    if: needs.prepare.outputs.align_count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AUDIO_KEY: ${{ secrets.AUDIO_KEY }}
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
      ALIGN_SLUGS: ${{ needs.prepare.outputs.align_slugs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: Check the AUDIO_KEY secret
        run: |
          if [ -z "$AUDIO_KEY" ]; then
            echo "::error title=Нет секрета AUDIO_KEY::Записи в репозитории зашифрованы."
            exit 1
          fi
          if ! [[ "$AUDIO_KEY" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error title=AUDIO_KEY неверного вида::Ожидается 64 шестнадцатеричных знака (32 байта)."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/pipeline/requirements.txt
      - name: Cache models (Demucs, MMS_FA, Whisper, CLAP, beat_this)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/torch
            ~/.cache/huggingface
            ~/.cache/whisper
          key: models-v1-${{ hashFiles('scripts/pipeline/requirements.txt') }}
          restore-keys: models-v1-
      - name: Cache Demucs stems (encrypted, four stems)
        uses: actions/cache@v4
        with:
          path: work/stem-cache
          key: stems-htdemucs4-v1-cal-${{ github.run_id }}
          restore-keys: stems-htdemucs4-v1-
      - name: Install ffmpeg and Python packages
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r scripts/pipeline/requirements.txt
          python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -c "import torch; print('torch', torch.__version__, 'cuda', torch.cuda.is_available()); raise SystemExit('+cu' in torch.__version__)"
      - name: Calibrate every song before any align
        run: |
          set -u
          printf '%s\n' $ALIGN_SLUGS > /tmp/calibrate.txt
          while read -r slug; do
            [ -z "$slug" ] && continue
            echo "::group::$slug: calibrate"
            (cd scripts/pipeline && python3 stem_cache.py unpack "$slug" ../../work/stem-cache) < /dev/null
            bash scripts/pipeline/sandbox/run.sh "$slug" calibrate < /dev/null
            rc=$?
            echo "::endgroup::"
            if [ $rc -ge 2 ]; then
              echo "::error::$slug: калибровка не собрала оценки"
              exit 2
            fi
          done < /tmp/calibrate.txt
          python3 scripts/pipeline/calibrate_score.py --choose
          python3 - <<'PY'
          import json
          from pathlib import Path
          want = [s for s in Path('/tmp/calibrate.txt').read_text(encoding='utf-8').split() if s]
          data = json.loads(Path('docs/analysis/bench/calibration.json').read_text(encoding='utf-8'))
          have = {Path(src).parent.name for src in data.get('sources', [])}
          missing = [s for s in want if s not in have]
          if missing:
              raise SystemExit('в калибровке нет песен: ' + ', '.join(missing))
          print('калибровка покрывает: ' + ' '.join(want))
          PY
          rm -rf pipeline-pack
          mkdir -p pipeline-pack/docs/analysis/bench
          cp docs/analysis/bench/calibration.json docs/analysis/bench/calibration.md pipeline-pack/docs/analysis/bench/
      - name: Upload calibration
        uses: actions/upload-artifact@v4
        with:
          name: calibration
          path: pipeline-pack
          if-no-files-found: error
          retention-days: 7

  align:
    needs: [prepare, calibrate]
    if: needs.prepare.outputs.align_count != '0' && needs.calibrate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJson(needs.prepare.outputs.align_matrix) }}
    env:
      AUDIO_KEY: ${{ secrets.AUDIO_KEY }}
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
      # 90 minutes. Measured on 39102852010, I Have Come Alive used 2381 s through
      # large-v3-turbo and the 70 minute cap then skipped large-v3. This budget
      # starts it and still leaves the 150 minute job under 120 minutes.
      WHISPER_BUDGET_S: '5400'
      # Phoneme models share this job with the Whisper ladder. 30 minutes keeps
      # a slow song inside the 150 minute limit. An unfinished model is not measured.
      PHONEME_BUDGET_S: '1800'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: Check the AUDIO_KEY secret
        run: |
          if [ -z "$AUDIO_KEY" ]; then
            echo "::error title=Нет секрета AUDIO_KEY::Записи в репозитории зашифрованы."
            exit 1
          fi
          if ! [[ "$AUDIO_KEY" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error title=AUDIO_KEY неверного вида::Ожидается 64 шестнадцатеричных знака (32 байта)."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/pipeline/requirements.txt
      - name: Cache models (Demucs, MMS_FA, Whisper, CLAP, beat_this)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/torch
            ~/.cache/huggingface
            ~/.cache/whisper
          # A separate key per song so parallel jobs can each save the weights
          # they downloaded. The shared models-v1 cache is still the restore.
          key: models-song-v1-${{ matrix.slug }}-${{ hashFiles('scripts/pipeline/requirements.txt') }}
          restore-keys: |
            models-song-v1-${{ matrix.slug }}-
            models-v1-
      - name: Cache Demucs stems (encrypted, four stems)
        uses: actions/cache@v4
        with:
          path: work/stem-cache
          key: stems-htdemucs4-v1-${{ matrix.slug }}-${{ github.run_id }}
          restore-keys: |
            stems-htdemucs4-v1-${{ matrix.slug }}-
            stems-htdemucs4-v1-
      - name: Install ffmpeg and Python packages
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg espeak-ng
          python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r scripts/pipeline/requirements.txt
          python -m pip install stable-ts
          python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -c "import torch; print('torch', torch.__version__, 'cuda', torch.cuda.is_available()); raise SystemExit('+cu' in torch.__version__)"
      - name: Download the joint calibration
        uses: actions/download-artifact@v4
        with:
          name: calibration
          path: incoming-cal
      - name: Align this song
        env:
          SLUG: ${{ matrix.slug }}
          STAGES: ${{ matrix.stages }}
          ALIGN_ARGS: ${{ matrix.align }}
        run: |
          set -u
          src=incoming-cal
          if [ -d incoming-cal/pipeline-pack ]; then src=incoming-cal/pipeline-pack; fi
          mkdir -p docs/analysis/bench
          cp "$src/docs/analysis/bench/calibration.json" docs/analysis/bench/calibration.json
          cp "$src/docs/analysis/bench/calibration.md" docs/analysis/bench/calibration.md
          test -s docs/analysis/bench/calibration.json
          echo "align-start $(date -u +%Y-%m-%dT%H:%M:%SZ) WHISPER_BUDGET_S=$WHISPER_BUDGET_S"
          (cd scripts/pipeline && python3 stem_cache.py unpack "$SLUG" ../../work/stem-cache) < /dev/null
          set +e
          ALIGN_ARGS="$ALIGN_ARGS" bash scripts/pipeline/sandbox/run.sh "$SLUG" $STAGES < /dev/null
          rc=$?
          set -e
          (cd scripts/pipeline && python3 stem_cache.py pack "$SLUG" ../../work/stem-cache) < /dev/null || true
          echo "align-end $(date -u +%Y-%m-%dT%H:%M:%SZ) код $rc"
          if [ -f "work/$SLUG/run.log" ]; then
            grep -E '^--- |^=== итог' "work/$SLUG/run.log" || true
          fi
          if [ "$rc" -ge 2 ]; then
            exit 2
          fi
          rm -rf pipeline-pack
          # report/ is not named work/: a directory named work is gitignored, and the
          # upload would then drop the align report.
          mkdir -p "pipeline-pack/content/songs/$SLUG" "pipeline-pack/docs/analysis" "pipeline-pack/report/$SLUG" pipeline-pack/stems
          cp "content/songs/$SLUG/lyrics.json" "content/songs/$SLUG/song.json" "pipeline-pack/content/songs/$SLUG/"
          cp -a "docs/analysis/$SLUG" pipeline-pack/docs/analysis/
          cp "work/$SLUG/align-report.json" "work/$SLUG/lyrics.before.json" "work/$SLUG/timing.json" "work/$SLUG/run.log" "pipeline-pack/report/$SLUG/"
          find work/stem-cache -maxdepth 1 -type f -name "${SLUG}-*.flac.enc" -exec cp {} pipeline-pack/stems/ \; || true
      - name: Upload alignment
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: align-${{ matrix.slug }}
          path: pipeline-pack
          if-no-files-found: error
          retention-days: 7

  prove:
    needs: [prepare, calibrate, align]
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      (
        (needs.prepare.outputs.align_count != '0' && needs.calibrate.result == 'success' && needs.align.result == 'success')
        ||
        (needs.prepare.outputs.reuse_run != '' && needs.prepare.outputs.align_count == '0')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      AUDIO_KEY: ${{ secrets.AUDIO_KEY }}
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
      ALIGN_SLUGS: ${{ needs.prepare.outputs.prove_slugs }}
      ALIGN_FILES: ${{ needs.prepare.outputs.prove_files }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: Check the AUDIO_KEY secret
        run: |
          if [ -z "$AUDIO_KEY" ]; then
            echo "::error title=Нет секрета AUDIO_KEY::Записи в репозитории зашифрованы."
            exit 1
          fi
          if ! [[ "$AUDIO_KEY" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error title=AUDIO_KEY неверного вида::Ожидается 64 шестнадцатеричных знака (32 байта)."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/pipeline/requirements.txt
      - name: Cache Demucs stems (encrypted, four stems)
        uses: actions/cache@v4
        with:
          path: work/stem-cache
          key: stems-htdemucs4-v1-prove-${{ github.run_id }}
          restore-keys: stems-htdemucs4-v1-
      - name: Install ffmpeg and Python packages
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r scripts/pipeline/requirements.txt
          python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -c "import torch; print('torch', torch.__version__, 'cuda', torch.cuda.is_available()); raise SystemExit('+cu' in torch.__version__)"
      - name: Download calibration and alignments
        if: needs.prepare.outputs.reuse_run == ''
        uses: actions/download-artifact@v4
        with:
          pattern: 'align-*'
          path: incoming
          merge-multiple: true
      - name: Download calibration file
        if: needs.prepare.outputs.reuse_run == ''
        uses: actions/download-artifact@v4
        with:
          name: calibration
          path: incoming-cal
      - name: Download an earlier alignment
        if: needs.prepare.outputs.reuse_run != ''
        uses: actions/download-artifact@v4
        with:
          pattern: 'align-*'
          path: incoming
          merge-multiple: true
          run-id: ${{ needs.prepare.outputs.reuse_run }}
          github-token: ${{ github.token }}
      - name: Download that run's calibration
        if: needs.prepare.outputs.reuse_run != ''
        uses: actions/download-artifact@v4
        with:
          name: calibration
          path: incoming-cal
          run-id: ${{ needs.prepare.outputs.reuse_run }}
          github-token: ${{ github.token }}
      - name: Measure the rule and check the songs
        id: run
        run: |
          set +e
          worst=0
          : > /tmp/summary.txt
          src=incoming
          if [ -d incoming/pipeline-pack ]; then src=incoming/pipeline-pack; fi
          cal=incoming-cal
          if [ -d incoming-cal/pipeline-pack ]; then cal=incoming-cal/pipeline-pack; fi
          mkdir -p docs/analysis/bench work
          cp "$cal/docs/analysis/bench/calibration.json" docs/analysis/bench/calibration.json
          cp "$cal/docs/analysis/bench/calibration.md" docs/analysis/bench/calibration.md
          cp -a "$src/content/songs/." content/songs/
          cp -a "$src/docs/analysis/." docs/analysis/
          if [ -d "$src/report" ]; then
            for d in "$src/report"/*; do
              [ -d "$d" ] || continue
              slug=$(basename "$d")
              mkdir -p "work/$slug"
              cp -a "$d/." "work/$slug/"
            done
          fi
          printf '%s\n' $ALIGN_SLUGS > /tmp/calibrate.txt
          missing=0
          while read -r slug; do
            [ -z "$slug" ] && continue
            if [ ! -f "work/$slug/align-report.json" ]; then
              echo "::error::нет work/$slug/align-report.json"
              missing=1
            fi
            echo "::group::$slug stages"
            grep -E '^--- |^=== итог' "work/$slug/run.log" || true
            echo "::endgroup::"
          done < /tmp/calibrate.txt
          if [ $missing -ne 0 ]; then
            echo "worst=2" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          mkdir -p work/stem-cache
          for stems_dir in "$src/stems" incoming/stems; do
            if [ -d "$stems_dir" ]; then
              cp -a "$stems_dir/." work/stem-cache/
            fi
          done
          while read -r slug; do
            [ -z "$slug" ] && continue
            (cd scripts/pipeline && python3 stem_cache.py unpack "$slug" ../../work/stem-cache) < /dev/null
            if [ -f "work/$slug/stems/vocals.wav" ]; then
              continue
            fi
            echo "$slug: в кэше нет голосового стема, считаю Demucs"
            bash scripts/pipeline/sandbox/run.sh "$slug" separate < /dev/null
            rc=$?
            if [ $rc -ge 2 ] || [ ! -f "work/$slug/stems/vocals.wav" ]; then
              echo "::error::$slug: голосовой стем не собран"
              missing=1
            else
              (cd scripts/pipeline && python3 stem_cache.py pack "$slug" ../../work/stem-cache) < /dev/null || true
            fi
          done < /tmp/calibrate.txt
          if [ $missing -ne 0 ]; then
            echo "worst=2" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "::group::aligner review"
          python3 scripts/pipeline/aligner_review.py --choose $(tr '\n' ' ' < /tmp/calibrate.txt)
          rc=$?
          echo "::endgroup::"
          echo "aligner-review: код $rc" >> /tmp/summary.txt
          align_rc=0
          if [ $rc -ne 0 ]; then
            align_rc=2
            worst=2
            echo "::error::разбор расхождений не собрался"
          fi
          if [ $align_rc -eq 0 ]; then
            echo "::group::whisper choice"
            python3 scripts/pipeline/whisper_choice.py --choose $(tr '\n' ' ' < /tmp/calibrate.txt)
            rc=$?
            echo "::endgroup::"
            echo "whisper-choice: код $rc" >> /tmp/summary.txt
            if [ $rc -ne 0 ]; then
              align_rc=2
              worst=2
              echo "::error::свидетель не выбран"
            fi
          fi
          if [ $align_rc -eq 0 ]; then
            echo "::group::attack chance"
            python3 scripts/pipeline/attack_chance.py --choose $(tr '\n' ' ' < /tmp/calibrate.txt)
            rc=$?
            echo "::endgroup::"
            echo "attack-chance: код $rc" >> /tmp/summary.txt
            if [ $rc -ne 0 ]; then
              align_rc=2
              worst=2
              echo "::error::замер атак не выбрал правило"
            else
              python3 - <<'PY'
          import json
          from pathlib import Path
          want = [s for s in Path('/tmp/calibrate.txt').read_text(encoding='utf-8').split() if s]
          data = json.loads(Path('docs/analysis/bench/attack-chance.json').read_text(encoding='utf-8'))
          have = set(data.get('songs') or [])
          missing = [s for s in want if s not in have]
          if missing:
              raise SystemExit('нет замера атак: ' + ', '.join(missing))
          chosen = data.get('chosen') or {}
          if not chosen.get('within_limit'):
              raise SystemExit('случайный проход выше предела: ' + str(chosen.get('chance')))
          print('правило слова: ' + str(chosen.get('name')) + ' случайный проход ' + str(chosen.get('chance')))
          PY
              rc=$?
              if [ $rc -ne 0 ]; then
                align_rc=2
                worst=2
                echo "::error::замер атак не покрыл песни или не уложился в 15 %"
              fi
            fi
          fi
          if [ $align_rc -eq 0 ]; then
            while read -r slug; do
              [ -z "$slug" ] && continue
              echo "::group::$slug: qa"
              PIPELINE_SKIP_PREP=1 bash scripts/pipeline/sandbox/run.sh "$slug" qa < /dev/null
              rc=$?
              echo "::endgroup::"
              echo "$slug qa: код $rc" >> /tmp/summary.txt
              if [ $rc -eq 2 ]; then
                echo "::error::$slug: проверка упала"
                worst=2
              fi
              [ $rc -gt $worst ] && worst=$rc
            done < /tmp/calibrate.txt
          fi
          echo "worst=$worst" >> "$GITHUB_OUTPUT"
          cat /tmp/summary.txt >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: Commit results and remove the job files
        if: always() && steps.run.outcome == 'success'
        run: |
          rm -rf pipeline-pack incoming incoming-cal
          git config user.name 'github-actions[bot]'
          git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
          for slug in ${{ needs.prepare.outputs.prove_slugs }}; do
            git add "content/songs/$slug/lyrics.json" "content/songs/$slug/song.json" 2>/dev/null || true
            [ -f "docs/analysis/$slug-qa.md" ] && git add "docs/analysis/$slug-qa.md"
            [ -f "docs/analysis/$slug-pipeline.md" ] && git add "docs/analysis/$slug-pipeline.md"
            [ -d "docs/analysis/$slug" ] && git add "docs/analysis/$slug"
          done
          if [ -d docs/analysis/bench ]; then git add docs/analysis/bench; fi
          for f in ${{ needs.prepare.outputs.prove_files }}; do
            git rm -q --ignore-unmatch "$f"
          done
          if git diff --cached --quiet; then echo 'нечего коммитить'; exit 0; fi
          git commit -q -m "pipeline: ${{ needs.prepare.outputs.prove_slugs }}" -m "Run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          echo '::error::не удалось отправить коммит'; exit 1
      - name: Fail when a stage failed
        if: steps.run.outputs.worst == '2'
        run: exit 1
