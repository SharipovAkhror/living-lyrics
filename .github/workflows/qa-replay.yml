# One replay of the proof from run 41171958873.
# That run skipped prove (measure=no) and left no qa-sync.json.
# The three songs come from that run. Alive comes from 40144966993, the same
# artifact as the previous replay: attack_chance keeps the published rule of
# the frozen three only when a fresh song is named beside them. A three-song
# list remeasures that rule and returns 2 before qa.
# This workflow does not separate, does not align, and does not commit.
# It unpacks the alignment artifacts, repeats the prove measurements, and
# uploads the qa reports. Remove the file once the report is in the repo.

name: qa-replay

on:
  push:
    paths:
      - '.github/workflows/qa-replay.yml'

permissions:
  contents: read
  actions: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      AUDIO_KEY: ${{ secrets.AUDIO_KEY }}
      GH_TOKEN: ${{ github.token }}
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Check the AUDIO_KEY secret
        run: |
          if [ -z "$AUDIO_KEY" ]; then
            echo "::error title=Нет секрета AUDIO_KEY::Записи в репозитории зашифрованы."
            exit 1
          fi
          if ! [[ "$AUDIO_KEY" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error title=AUDIO_KEY неверного вида::Ожидается 64 шестнадцатеричных знака (32 байта)."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/pipeline/requirements.txt
      - name: Cache models (Demucs, MMS_FA, Whisper, CLAP, beat_this)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/torch
            ~/.cache/huggingface
            ~/.cache/whisper
          key: models-v1-${{ hashFiles('scripts/pipeline/requirements.txt') }}
          restore-keys: models-v1-
      - name: Install ffmpeg and Python packages
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r scripts/pipeline/requirements.txt
          python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -c "import torch; print('torch', torch.__version__, 'cuda', torch.cuda.is_available()); raise SystemExit('+cu' in torch.__version__)"
      - name: Download the finished alignments
        run: |
          set -euo pipefail
          mkdir -p incoming
          pairs="alive=40144966993,i-have-come-alive=41171958873,karitas=41171958873,one=41171958873"
          IFS=',' read -ra items <<< "$pairs"
          for pair in "${items[@]}"; do
            slug="${pair%%=*}"
            run_id="${pair#*=}"
            tmp="$(mktemp -d)"
            echo "скачиваю align-$slug из $run_id"
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" -n "align-$slug" -D "$tmp"
            if [ -d "$tmp/pipeline-pack" ]; then
              cp -a "$tmp/pipeline-pack/." incoming/
            else
              cp -a "$tmp/." incoming/
            fi
            rm -rf "$tmp"
            if [ ! -f "incoming/report/$slug/align-report.json" ]; then
              echo "::error::в артефакте align-$slug нет отчёта"
              exit 1
            fi
          done
      - name: Measure the rule and check the songs
        id: run
        run: |
          set +e
          worst=0
          src=incoming
          if [ -d incoming/pipeline-pack ]; then src=incoming/pipeline-pack; fi
          mkdir -p docs/analysis/bench work
          cp -a "$src/content/songs/." content/songs/
          cp -a "$src/docs/analysis/." docs/analysis/
          printf '%s\n' alive i-have-come-alive karitas one > /tmp/calibrate.txt
          missing=0
          while read -r slug; do
            [ -z "$slug" ] && continue
            if [ ! -f "$src/report/$slug/align-report.json" ]; then
              echo "::error::нет отчёта $slug"
              missing=1
              continue
            fi
            mkdir -p "work/$slug"
            cp -a "$src/report/$slug/." "work/$slug/"
          done < /tmp/calibrate.txt
          if [ $missing -ne 0 ]; then
            echo "worst=2" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          mkdir -p work/stem-cache
          if [ -d "$src/stems" ]; then
            cp -a "$src/stems/." work/stem-cache/
          fi
          while read -r slug; do
            [ -z "$slug" ] && continue
            (cd scripts/pipeline && python3 stem_cache.py unpack "$slug" ../../work/stem-cache) < /dev/null
            if [ ! -f "work/$slug/stems/vocals.wav" ]; then
              echo "::error::$slug: голосовой стем не распакован, новое отделение не запускаю"
              missing=1
            fi
          done < /tmp/calibrate.txt
          if [ $missing -ne 0 ]; then
            echo "worst=2" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "::group::language ctc"
          python3 scripts/pipeline/lang_ctc.py --measure $(tr '\n' ' ' < /tmp/calibrate.txt) || echo "языковой CTC не измерен, проверка продолжается"
          echo "::endgroup::"
          echo "::group::aligner review"
          python3 scripts/pipeline/aligner_review.py --choose $(tr '\n' ' ' < /tmp/calibrate.txt)
          rc=$?
          echo "::endgroup::"
          align_rc=0
          if [ $rc -ne 0 ]; then
            align_rc=2
            worst=2
            echo "::error::разбор расхождений не собрался"
          fi
          if [ $align_rc -eq 0 ]; then
            echo "::group::whisper choice"
            python3 scripts/pipeline/whisper_choice.py --choose $(tr '\n' ' ' < /tmp/calibrate.txt)
            rc=$?
            echo "::endgroup::"
            if [ $rc -ne 0 ]; then
              align_rc=2
              worst=2
              echo "::error::свидетель не выбран"
            fi
          fi
          if [ $align_rc -eq 0 ]; then
            echo "::group::attack chance"
            python3 scripts/pipeline/attack_chance.py --choose $(tr '\n' ' ' < /tmp/calibrate.txt)
            rc=$?
            echo "::endgroup::"
            echo "attack-chance: код $rc"
            if [ $rc -ne 0 ]; then
              align_rc=2
              worst=2
              echo "::error::замер атак не собрался"
            fi
          fi
          if [ $align_rc -eq 0 ]; then
            while read -r slug; do
              [ -z "$slug" ] && continue
              echo "::group::$slug: qa"
              PIPELINE_SKIP_PREP=1 bash scripts/pipeline/sandbox/run.sh "$slug" qa < /dev/null
              rc=$?
              echo "::endgroup::"
              echo "$slug qa: код $rc"
              if [ $rc -eq 2 ]; then
                echo "::error::$slug: проверка упала"
                worst=2
              fi
              [ $rc -gt $worst ] && worst=$rc
            done < /tmp/calibrate.txt
          fi
          echo "worst=$worst" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Keep the qa report
        if: always()
        run: |
          rm -rf qa-pack
          mkdir -p qa-pack
          for slug in alive i-have-come-alive karitas one; do
            if [ -f "work/$slug/qa-sync.json" ]; then
              mkdir -p "qa-pack/$slug"
              cp "work/$slug/qa-sync.json" "qa-pack/$slug/qa-sync.json"
              [ -f "work/$slug/qa-sync.md" ] && cp "work/$slug/qa-sync.md" "qa-pack/$slug/qa-sync.md"
              [ -f "work/$slug/qa-sync-before.json" ] && cp "work/$slug/qa-sync-before.json" "qa-pack/$slug/qa-sync-before.json"
            fi
          done
          if [ -f docs/analysis/bench/attack-chance.json ]; then
            cp docs/analysis/bench/attack-chance.json qa-pack/attack-chance.json
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          pack = Path('qa-pack')
          lines = []
          for slug in ('alive', 'i-have-come-alive', 'karitas', 'one'):
              path = pack / slug / 'qa-sync.json'
              if not path.is_file():
                  lines.append(f'{slug}: нет qa-sync.json')
                  continue
              data = json.loads(path.read_text(encoding='utf-8'))
              proof = data.get('proof') or {}
              gate = data.get('file_gate') or {}
              lost = [str(item) for item in (gate.get('lost') or [])]
              rows = [row for row in (proof.get('lines') or []) if isinstance(row, dict)]
              reasons = {}
              for row in rows:
                  if row.get('pass'):
                      continue
                  reasons[str(row.get('reason') or '?')] = reasons.get(str(row.get('reason') or '?'), 0) + 1
              lines.append(f"{slug}: строк {len(rows)}, потеряно файла {len(lost)}, отказ {gate.get('refused')}")
              if lost:
                  lines.append(slug + ' lost: ' + ' '.join(lost))
              if reasons:
                  lines.append(slug + ' reasons: ' + ', '.join(f'{k} {v}' for k, v in sorted(reasons.items())))
              by_lang = {}
              for row in rows:
                  lang = str(row.get('lang') or '?')
                  bucket = by_lang.setdefault(lang, [0, 0])
                  bucket[1] += 1
                  if row.get('pass'):
                      bucket[0] += 1
              if by_lang:
                  parts = [f'{lang} {got}/{n}' for lang, (got, n) in sorted(by_lang.items())]
                  lines.append(slug + ' pass-by-lang: ' + ', '.join(parts))
          text = '\n'.join(lines) + '\n'
          (pack / 'summary.txt').write_text(text, encoding='utf-8')
          print(text)
          PY
      - name: Upload qa-sync
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-sync
          path: qa-pack
          if-no-files-found: warn
          retention-days: 90
      - name: Fail when a stage failed
        if: steps.run.outputs.worst == '2'
        run: exit 1
