# Repo hygiene on GitHub, by event: after every update of main, delete the branches merged into it
# and list the rest in the run summary. No Claude session, no Station. Rules: scripts/tools/repo_hygiene.py
# (branches cut from main with no work yet, younger than a day or tied to a board task are kept).
name: cleanup
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: cleanup, cancel-in-progress: false }
jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Delete merged branches, report the rest
        run: |
          python3 scripts/tools/repo_hygiene.py --apply | tee hygiene.txt
          { echo '### Порядок'; echo; sed 's/^/    /' hygiene.txt; } >> "$GITHUB_STEP_SUMMARY"
