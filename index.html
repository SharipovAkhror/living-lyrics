<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f2f7" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Living Lyrics" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="64x64" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <link rel="preload" href="/fonts/KFGQPC-Uthmanic-Script-HAFS.otf" as="font" type="font/otf" crossorigin />
    <title>Living Lyrics</title>
    <script>
      // Claim a playback session before any module runs. Safari's default "auto" session
      // can freeze or silence an <audio> element after the iPhone screen locks.
      try {
        var session = navigator.audioSession;
        if (session) session.type = 'playback';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
